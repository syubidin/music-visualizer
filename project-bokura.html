<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bokura dake no Shudaika - Centimillimental | Interactive</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Rock+Salt&family=Inter:wght@300;600&display=swap" rel="stylesheet" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='0' y='0' width='64' height='64' rx='16' fill='%2387CEEB'/%3E%3Cpath d='M18 32L18 32 M27 20L27 44 M36 14L36 50 M45 20L45 44 M54 32L54 32' stroke='%23ffffff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <style>
      :root {
        --sky-morning: #87ceeb;
        --sky-noon: #4682b4;
        --sky-twilight: #2c3e50;
        --sky-bridge: #1a0b0b; /* Dark red/black for despair */
        --sky-sunrise: #ffecd2;

        --text-light: #fff;
        --text-dark: #333;
        --accent-blue: #00bfff;
        --string-color: rgba(255, 255, 255, 0.4);
      }

      /* RESET & MOBILE LOCK */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--sky-morning);
        color: var(--text-light);
        font-family: 'Noto Serif JP', serif;
        overflow: hidden;
        position: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        transition: background-color 1.5s ease;
      }

      /* --- BACKGROUND LAYERS --- */
      #sky-gradient {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, rgba(0, 0, 0, 0.1) 100%);
        z-index: 0;
        pointer-events: none;
      }

      /* Clouds */
      #cloud-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
        opacity: 0.6;
      }
      .cloud {
        position: absolute;
        background: #fff;
        border-radius: 50%;
        filter: blur(20px);
        opacity: 0.8;
        animation: floatCloud linear infinite;
      }

      /* --- GAP FILLER: GUITAR STRINGS --- */
      #guitar-strings {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        z-index: 2;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      .string {
        width: 100%;
        height: 2px;
        background: var(--string-color);
        transform-origin: center;
      }
      .vibrating {
        animation: vibrate 0.1s infinite;
      }

      /* --- UI ELEMENTS --- */
      #song-nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 20px 30px;
        z-index: 9999;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: opacity 1s ease, transform 1s ease;
        pointer-events: auto;
      }
      #song-nav.nav-hidden {
        opacity: 0;
        transform: translateY(-20px);
        pointer-events: none;
      }
      .nav-home,
      .nav-x {
        color: #fff;
        text-decoration: none;
        opacity: 0.8;
        transition: 0.3s;
        display: flex;
        gap: 10px;
        align-items: center;
        text-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
      }
      .nav-home:hover,
      .nav-x:hover {
        opacity: 1;
        transform: scale(1.1);
      }

      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(135, 206, 235, 0.9);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 200;
        transition: opacity 1.5s ease;
      }
      #overlay h1 {
        font-family: 'Rock Salt', cursive;
        font-size: 2.5rem;
        color: #fff;
        text-shadow: 2px 2px 0 var(--accent-blue);
        margin-bottom: 20px;
        transform: rotate(-3deg);
      }
      #overlay p {
        font-family: 'Inter', sans-serif;
        font-size: 0.8rem;
        letter-spacing: 2px;
      }

      #ending-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        z-index: 150;
        opacity: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 2s ease;
      }
      #ending-screen h1 {
        color: #333;
        font-family: 'Noto Serif JP', serif;
        font-size: 1.8rem;
        margin-bottom: 10px;
      }
      #ending-screen p {
        color: #666;
        font-size: 0.9rem;
        margin-bottom: 30px;
        font-style: italic;
      }
      #replay-btn {
        background: transparent;
        border: 2px solid #333;
        color: #333;
        padding: 10px 40px;
        font-family: 'Inter', sans-serif;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }
      #replay-btn:hover {
        background: #333;
        color: #fff;
      }

      #final-footer {
        position: fixed;
        bottom: 30px;
        width: 100%;
        text-align: center;
        font-family: 'Inter', sans-serif;
        font-size: 0.7rem;
        color: #888;
        z-index: 1000;
        opacity: 0;
        transition: opacity 2s ease 1s;
      }
      .visible-block {
        opacity: 1 !important;
        pointer-events: auto !important;
      }

      /* --- LYRICS CONTAINER --- */
      #lyric-container {
        position: relative;
        z-index: 50;
        width: 90%;
        max-width: 1000px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 300px;
        perspective: 1000px;
      }

      .line {
        transition: all 0.5s ease;
        opacity: 0;
        transform: translateY(20px);
        margin-bottom: 8px;
      }

      .jp {
        font-size: 2.2rem;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      }
      .en {
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.9);
        font-weight: 300;
      }
      .id {
        font-family: 'Inter', sans-serif;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.7);
        font-style: italic;
      }

      .line.show {
        opacity: 1;
        transform: translateY(0);
      }

      /* --- MOODS & ANIMATIONS --- */

      /* 1. Normal (Morning) */
      .mood-morning {
        background-color: var(--sky-morning);
      }

      /* 2. Run/Energetic (Noon) */
      .mood-run {
        background-color: var(--sky-noon);
      }
      .mood-run .jp {
        transform: skewX(-10deg);
      } /* Speed effect */

      /* 3. Sad/Twilight */
      .mood-twilight {
        background-color: var(--sky-twilight);
      }
      .mood-twilight .jp {
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      /* 4. Bridge (Despair) */
      .mood-despair {
        background-color: var(--sky-bridge);
      }
      .mood-despair #cloud-layer {
        opacity: 0;
      }
      .mood-despair .jp {
        font-family: 'Rock Salt', cursive;
        font-size: 1.8rem;
        color: #ff4444;
        animation: shake 0.1s infinite;
      }
      .mood-despair .en,
      .mood-despair .id {
        color: #aaa;
      }

      /* 5. Climax (Sunrise/Hope) */
      .mood-sunrise {
        background-color: var(--sky-sunrise);
      }
      .mood-sunrise .jp {
        color: #333;
        font-size: 2.8rem;
        text-shadow: 2px 2px 0px rgba(255, 165, 0, 0.5);
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .mood-sunrise .en {
        color: #555;
        font-weight: bold;
      }
      .mood-sunrise .id {
        color: #777;
      }

      /* Emphasis */
      .highlight {
        font-size: 3rem !important;
        color: #fff200 !important;
        text-shadow: 0 0 15px rgba(255, 165, 0, 0.8) !important;
      }

      /* Keyframes */
      @keyframes floatCloud {
        from {
          transform: translateX(100vw);
        }
        to {
          transform: translateX(-100vw);
        }
      }
      @keyframes vibrate {
        0% {
          transform: translateY(0);
        }
        25% {
          transform: translateY(2px);
        }
        75% {
          transform: translateY(-2px);
        }
        100% {
          transform: translateY(0);
        }
      }
      @keyframes shake {
        0% {
          transform: translate(1px, 1px);
        }
        50% {
          transform: translate(-1px, -1px);
        }
        100% {
          transform: translate(1px, -1px);
        }
      }
      @keyframes popIn {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @media (max-width: 600px) {
        .jp {
          font-size: 1.5rem;
        }
        .mood-sunrise .jp {
          font-size: 1.8rem;
        }
        .highlight {
          font-size: 2rem !important;
        }
      }
    </style>
  </head>

    <script>

        c.style.top = `${Math.random() * 80}%`;
        c.style.animationDuration = `${Math.random() * 20 + 20}s`;
        cloudLayer.appendChild(c);

        { time: 273.98, jp: '何回も歌うよ 大事な思いを', en: "I'll sing it many times, these precious feelings", id: 'Kan kunyanyikan berkali-kali, perasaan berharga ini', type: 'run' },
        { time: 279.58, jp: '僕らだけの 主題歌にして', en: 'Making it our own theme song', id: 'Menjadikannya lagu tema kita semata', type: 'highlight' },

        { time: 286.48, type: 'gap' },

      overlay.addEventListener('click', () => {
        overlay.style.opacity = '0';
        setTimeout(() => (overlay.style.display = 'none'), 1500);
        songNav.classList.add('nav-hidden');
        audio.play();
        activateStrings(); // Start Intro Gap
      });

      audio.addEventListener('timeupdate', () => {
        const currentTime = audio.currentTime;
        let activeIndex = -1;
        for (let i = 0; i < lyrics.length; i++) {
          if (currentTime >= lyrics[i].time) activeIndex = i;
          else break;
        }
        if (activeIndex !== -1 && activeIndex !== currentLineIndex) {
          renderLyric(lyrics[activeIndex]);
          currentLineIndex = activeIndex;
        }
      });

      function renderLyric(line) {
        // MOOD
        if (line.type && line.type !== 'gap') {
          document.body.className = `mood-${line.type}`;
        }

        // GAP HANDLING
        if (line.type === 'gap') {
          lineJp.classList.remove('show');
          lineEn.classList.remove('show');
          lineId.classList.remove('show');
          activateStrings();
          return;
        }

        deactivateStrings();

        setTimeout(() => {
          lineJp.innerText = line.jp;
          lineEn.innerText = line.en;
          lineId.innerText = line.id;

          // Reset specific styling
          lineJp.className = 'line jp';
          if (line.type === 'highlight') lineJp.classList.add('highlight');

          lineJp.classList.add('show');
          lineEn.classList.add('show');
          lineId.classList.add('show');
        }, 100);
      }

      audio.addEventListener('ended', () => {
        deactivateStrings();
        lineJp.classList.remove('show');
        lineEn.classList.remove('show');
        lineId.classList.remove('show');

        endingScreen.classList.add('visible-block');
        endingScreen.style.opacity = '1';
        endingScreen.style.pointerEvents = 'auto';
        finalFooter.classList.add('visible-block');
        finalFooter.style.opacity = '1';
        songNav.classList.remove('nav-hidden');
      });

      replayBtn.addEventListener('click', () => {
        endingScreen.style.opacity = '0';
        endingScreen.style.pointerEvents = 'none';
        finalFooter.style.opacity = '0';
        songNav.classList.add('nav-hidden');

        audio.currentTime = 0;
        audio.play();
        currentLineIndex = -1;
        renderLyric(lyrics[0]);
      });
    </script>
  </body>
</html>

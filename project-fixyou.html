<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fix You - Coldplay | Interactive</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,700;1,300&family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-dark: #050505;
        --bg-warm: #1a1500;
        --light-bulb: #ffaa00;
        --text-color: #e0e0e0;
        --tear-color: rgba(174, 216, 255, 0.6);
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-dark);
        color: var(--text-color);
        font-family: 'Merriweather', serif;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        transition: background-color 2s ease;
      }

      /* --- THE SWINGING LIGHT --- */
      /* FIXED: Animation is now constant to prevent resetting/glitching */
      #light-container {
        position: absolute;
        top: -100px;
        left: 50%;
        transform-origin: top center;
        animation: swing 6s ease-in-out infinite;
        z-index: 5;
        pointer-events: none;
        opacity: 0.6;
        transition: opacity 2s;
      }

      #cord {
        width: 2px;
        height: 400px;
        background: linear-gradient(to bottom, #333, #111);
        margin: 0 auto;
      }

      #bulb {
        width: 60px;
        height: 60px;
        background: radial-gradient(circle, #fff, var(--light-bulb), transparent);
        border-radius: 50%;
        margin: -10px auto 0;
        /* Shadow transition for intensity changes */
        box-shadow: 0 0 40px var(--light-bulb), 0 0 80px rgba(255, 170, 0, 0.2);
        opacity: 0.5;
        transition: box-shadow 2s ease, background 2s ease, opacity 2s ease;
      }

      /* --- PARTICLES --- */
      #particles {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
        overflow: hidden;
      }
      .mote {
        position: absolute;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        animation: floatMote linear infinite;
      }

      /* --- RAIN/TEARS LAYER --- */
      #rain-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
        pointer-events: none;
        display: none;
      }
      .drop {
        position: absolute;
        width: 1px;
        height: 60px;
        background: linear-gradient(to bottom, transparent, var(--tear-color));
        animation: fall 0.8s linear infinite;
      }

      /* --- OVERLAY --- */
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        cursor: pointer;
        transition: opacity 1.5s ease;
      }
      #overlay h1 {
        font-family: 'Montserrat', sans-serif;
        letter-spacing: 5px;
        text-transform: uppercase;
        font-size: 2rem;
        color: #888;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      }

      /* --- LYRICS --- */
      #lyric-container {
        position: relative;
        z-index: 10;
        padding: 20px;
        width: 80%;
        max-width: 800px;
      }

      #main-text {
        font-size: 1.8rem;
        font-weight: 300;
        line-height: 1.6;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 1s, transform 1s, filter 1s;
      }

      /* --- STYLES & STATES --- */
      .mood-dark {
        background-color: #050505;
      }
      .mood-warm {
        background-color: #1a1100;
      }

      /* STADIUM MODE: Intense Light, but smooth transition */
      .stadium-mode {
        background-color: #332200;
      }

      body.stadium-mode #bulb {
        opacity: 1;
        background: #fff;
        box-shadow: 0 0 150px #ffaa00, 0 0 300px rgba(255, 170, 0, 0.8);
      }
      /* Removed animation-duration change to fix the reset bug */

      /* Text Emphasis */
      .highlight-home {
        color: #ffcc00;
        text-shadow: 0 0 20px #ffaa00;
        font-size: 2.2rem;
      }
      .highlight-bones {
        color: #ffaa66;
        animation: flicker 0.1s infinite;
      }
      .highlight-tears {
        color: #aed8ff;
        text-shadow: 0 0 15px #aed8ff;
        font-style: italic;
      }

      /* Gap Filler Text */
      .gap-text {
        font-family: 'Montserrat', sans-serif;
        font-size: 0.9rem;
        letter-spacing: 4px;
        color: #555;
        animation: pulse 3s infinite;
        text-transform: lowercase;
      }

      /* --- ENDING (WARM DESIGN) --- */
      #ending-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* Warm Gradient */
        background: radial-gradient(circle at center, #4a3b00 0%, #1a1100 60%, #000 100%);
        z-index: 90;
        opacity: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 3s ease;
      }

      #ending-screen h1 {
        font-family: 'Merriweather', serif;
        font-style: italic;
        color: #ffdd99;
        text-shadow: 0 0 20px rgba(255, 170, 0, 0.5);
        font-size: 2.5rem;
        margin-bottom: 20px;
      }

      #replay-btn {
        background: transparent;
        border: 1px solid #ffcc00;
        color: #ffcc00;
        padding: 12px 40px;
        font-family: 'Montserrat', sans-serif;
        letter-spacing: 2px;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 20px;
      }
      #replay-btn:hover {
        background: rgba(255, 204, 0, 0.1);
        box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
      }

      #final-footer {
        position: absolute;
        bottom: 30px;
        opacity: 0;
        font-size: 0.9rem;
        color: #886600;
        font-family: 'Montserrat', sans-serif;
        letter-spacing: 1px;
        transition: opacity 2s ease 1s;
        z-index: 95;
      }

      .visible {
        opacity: 1 !important;
        pointer-events: auto !important;
        transform: translateY(0) !important;
      }

      /* --- KEYFRAMES --- */
      @keyframes swing {
        0% {
          transform: rotate(4deg);
        }
        50% {
          transform: rotate(-4deg);
        }
        100% {
          transform: rotate(4deg);
        }
      }
      @keyframes floatMote {
        0% {
          transform: translateY(0) translateX(0);
          opacity: 0;
        }
        50% {
          opacity: 0.8;
        }
        100% {
          transform: translateY(-50px) translateX(20px);
          opacity: 0;
        }
      }
      @keyframes fall {
        to {
          transform: translateY(100vh);
        }
      }
      @keyframes flicker {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.8;
        }
        100% {
          opacity: 1;
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.2;
          transform: scale(0.95);
        }
        50% {
          opacity: 0.6;
          transform: scale(1.05);
        }
      }
      /* --- GLOBAL NAVBAR STYLES --- */
      #song-nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 20px 30px;
        z-index: 9999; /* Highest priority */
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: opacity 1s ease, transform 1s ease;
        pointer-events: auto;
      }

      /* Hide nav when class is added */
      #song-nav.nav-hidden {
        opacity: 0;
        transform: translateY(-20px);
        pointer-events: none;
      }

      .nav-home {
        text-decoration: none;
        color: inherit; /* Takes color from the specific song's theme */
        opacity: 0.7;
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: sans-serif;
        font-size: 0.9rem;
        letter-spacing: 1px;
        transition: opacity 0.3s;
      }

      .nav-home:hover {
        opacity: 1;
      }

      /* Mobile Responsiveness */
      @media (max-width: 600px) {
        #song-nav {
          padding: 15px;
        }
        .nav-home span {
          display: none;
        } /* Show only icon on mobile */
      }
    </style>
  </head>
  <body>
    <nav id="song-nav">
      <a href="index.html" class="nav-home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Library</span>
      </a>
    </nav>
    <div id="light-container">
      <div id="cord"></div>
      <div id="bulb"></div>
    </div>

    <div id="particles"></div>
    <div id="rain-layer"></div>

    <div id="overlay">
      <h1>FIX YOU</h1>
      <p style="font-size: 0.8rem; margin-top: 20px; color: #555">[ CLICK TO BEGIN ]</p>
    </div>

    <div id="ending-screen">
      <h1>Lights will guide you home.</h1>
      <button id="replay-btn">Try Again</button>
    </div>
    <div id="final-footer">from: syuby</div>

    <audio id="audio-player">
      <source src="fixyou.mp3" type="audio/mpeg" />
    </audio>

    <div id="lyric-container">
      <div id="main-text"></div>
    </div>

    <script>
      // =======================================================
      // PARTICLE SYSTEM
      // =======================================================
      const particleContainer = document.getElementById('particles');
      function createMote() {
        const mote = document.createElement('div');
        mote.classList.add('mote');
        const size = Math.random() * 3;
        mote.style.width = `${size}px`;
        mote.style.height = `${size}px`;
        mote.style.left = `${Math.random() * 100}%`;
        mote.style.top = `${Math.random() * 100}%`;
        mote.style.animationDuration = `${Math.random() * 5 + 5}s`;
        particleContainer.appendChild(mote);
        setTimeout(() => {
          mote.remove();
        }, 10000);
      }
      setInterval(createMote, 200);

      // =======================================================
      // RAIN/TEAR SYSTEM
      // =======================================================
      const rainLayer = document.getElementById('rain-layer');
      let rainInterval;

      function toggleRain(active) {
        if (active) {
          rainLayer.style.display = 'block';
          if (!rainInterval) {
            rainInterval = setInterval(() => {
              const drop = document.createElement('div');
              drop.classList.add('drop');
              drop.style.left = `${Math.random() * 100}%`;
              drop.style.animationDuration = `${Math.random() * 0.5 + 0.5}s`;
              rainLayer.appendChild(drop);
              setTimeout(() => drop.remove(), 1000);
            }, 40); // Slightly faster rain for impact
          }
        } else {
          rainLayer.style.display = 'none';
          clearInterval(rainInterval);
          rainInterval = null;
          rainLayer.innerHTML = '';
        }
      }

      // =======================================================
      // LYRIC DATA
      // =======================================================
      const lyrics = [
        { time: 0, text: '', type: 'gap' },

        // VERSE 1
        { time: 14.08, text: "When you try your best, but you don't succeed", type: 'verse' },
        { time: 20.0, text: '( breathe )', type: 'gap' },
        { time: 21.39, text: 'When you get what you want, but not what you need', type: 'verse' },
        { time: 28.51, text: "When you feel so tired, but you can't sleep", type: 'verse' },
        { time: 34.42, text: 'Stuck in reverse', type: 'emphasis' },

        { time: 38.0, text: '...', type: 'gap' },

        { time: 42.4, text: 'And the tears come streaming down your face', type: 'tears' },
        { time: 49.63, text: "When you lose something you can't replace", type: 'tears' },
        { time: 56.35, text: 'When you love someone, but it goes to waste', type: 'tears' },
        { time: 62.76, text: 'Could it be worse?', type: 'verse' },

        // CHORUS 1
        { time: 73.02, text: 'Lights will guide you home', type: 'lights' },
        { time: 80.12, text: 'And ignite your bones', type: 'ignite' },
        { time: 87.05, text: 'And I will try to fix you', type: 'fix' },

        { time: 93.24, text: '( wandering )', type: 'gap' },

        // VERSE 2
        { time: 106.12, text: 'And high up above, or down below', type: 'verse' },
        { time: 112.76, text: "When you're too in love to let it go", type: 'verse' },
        { time: 119.65, text: "But if you never try, you'll never know", type: 'verse' },
        { time: 125.99, text: "Just what you're worth", type: 'emphasis' },

        { time: 130.0, text: '', type: 'gap' },

        // CHORUS 2
        { time: 136.45, text: 'Lights will guide you home', type: 'lights' },
        { time: 143.28, text: 'And ignite your bones', type: 'ignite' },
        { time: 150.4, text: 'And I will try to fix you', type: 'fix' },

        // BUILD UP
        { time: 156.74, text: 'fixing...', type: 'buildup' },

        // BRIDGE (CLIMAX)
        { time: 211.95, text: 'Tears stream down your face', type: 'climax' },
        { time: 218.14, text: 'When you lose something you cannot replace', type: 'climax' },
        { time: 225.74, text: 'Tears stream down your face, and I...', type: 'climax-high' },

        { time: 239.38, text: 'Tears stream down your face', type: 'climax' },
        { time: 245.14, text: 'I promise you I will learn from my mistakes', type: 'climax' },
        { time: 253.08, text: 'Tears stream down your face, and I...', type: 'climax-high' },

        // RESOLUTION
        { time: 266.79, text: 'Lights will guide you home', type: 'lights' },
        { time: 273.41, text: 'And ignite your bones', type: 'ignite' },
        { time: 280.28, text: 'And I will try to fix you', type: 'fix' },

        { time: 290.0, text: '', type: 'end-gap' },
      ];

      // =======================================================
      // LOGIC ENGINE
      // =======================================================
      const audio = document.getElementById('audio-player');
      const overlay = document.getElementById('overlay');
      const endingScreen = document.getElementById('ending-screen');
      const replayBtn = document.getElementById('replay-btn');
      const finalFooter = document.getElementById('final-footer');
      const mainText = document.getElementById('main-text');
      const songNav = document.getElementById('song-nav');
      const body = document.body;

      let currentLineIndex = -1;

      overlay.addEventListener('click', () => {
        overlay.style.opacity = '0';
        setTimeout(() => (overlay.style.display = 'none'), 1500);
        audio.play().catch((e) => alert('Please interact to play'));
        songNav.classList.add('nav-hidden');
      });

      audio.addEventListener('timeupdate', () => {
        const currentTime = audio.currentTime;
        let activeIndex = -1;
        for (let i = 0; i < lyrics.length; i++) {
          if (currentTime >= lyrics[i].time) activeIndex = i;
          else break;
        }
        if (activeIndex !== -1 && activeIndex !== currentLineIndex) {
          renderLyric(lyrics[activeIndex]);
          currentLineIndex = activeIndex;
        }
      });

      function renderLyric(line) {
        // RESET STATES
        toggleRain(false);
        body.className = 'mood-dark';
        mainText.className = '';
        mainText.classList.remove('visible');

        setTimeout(() => {
          if (line.type === 'gap') {
            if (line.text) {
              mainText.innerHTML = `<span class="gap-text">${line.text}</span>`;
              mainText.classList.add('visible');
            }
            return;
          }

          if (line.type === 'buildup') {
            mainText.innerHTML = '';
            body.className = 'mood-warm';
            return;
          }

          // NORMAL RENDER
          mainText.innerText = line.text;
          mainText.classList.add('visible');

          if (line.type === 'tears') {
            toggleRain(true);
            mainText.classList.add('highlight-tears');
          } else if (line.type === 'lights') {
            body.className = 'mood-warm';
            mainText.classList.add('highlight-home');
          } else if (line.type === 'ignite') {
            body.className = 'mood-warm';
            mainText.classList.add('highlight-bones');
          } else if (line.type === 'climax' || line.type === 'climax-high') {
            // High Intensity Mode
            body.className = 'stadium-mode';
            toggleRain(true);
            mainText.style.fontWeight = '700';
            mainText.style.fontSize = line.type === 'climax-high' ? '3rem' : '2.2rem';
          } else if (line.type === 'fix') {
            body.className = 'mood-warm';
          } else if (line.type === 'emphasis') {
            mainText.style.fontSize = '2.2rem';
          }
        }, 200);
      }

      // ENDING LOGIC
      audio.addEventListener('ended', () => {
        mainText.style.opacity = '0';
        // Hide light bulb smoothly
        document.getElementById('light-container').style.opacity = '0';

        endingScreen.classList.add('visible');
        finalFooter.classList.add('visible');
        songNav.classList.remove('nav-hidden');
      });

      // REPLAY
      replayBtn.addEventListener('click', () => {
        endingScreen.classList.remove('visible');
        finalFooter.classList.remove('visible');
        songNav.classList.add('nav-hidden');
        document.getElementById('light-container').style.opacity = '0.6';

        audio.currentTime = 0;
        audio.play();
        currentLineIndex = -1;
        renderLyric(lyrics[0]);
      });
    </script>
  </body>
</html>

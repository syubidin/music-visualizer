    />
    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Mincho&family=Zen+Kurenaido&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-color: #1a1a2e;
        --text-main: #e0e0e0;
        --accent-warm: #ff9a62;
        --accent-soft: #ffb7b2;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Sawarabi Mincho', serif;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        transition: background-color 2s ease, color 2s ease;
      }

      /* --- NOISE & VIGNETTE (Film Look) --- */
      body::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 5;
        mix-blend-mode: overlay;
      }

      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, transparent 60%, black 150%);
        pointer-events: none;
        z-index: 4;
      }

      /* --- BACKGROUND GRADIENT --- */
      #bg-gradient {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(255, 154, 98, 0) 100%);
        opacity: 0;
        transition: opacity 3s ease;
        z-index: 0;
        pointer-events: none;
      }

      /* --- PARTICLES --- */
      #particles {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
      }
      .firefly {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
        box-shadow: 0 0 10px rgba(255, 255, 210, 0.8);
        animation: floatParticle linear forwards;
      }

      /* --- MEMORY FRAGMENTS (Gap Filler) --- */
      #memory-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
        overflow: hidden;
      }
      .memory-word {
        position: absolute;
        font-family: 'Zen Kurenaido', sans-serif;
        color: rgba(255, 255, 255, 0.15);
        font-size: 1.2rem;
        user-select: none;
        animation: driftFade 6s ease-out forwards;
      }

      /* --- OVERLAY --- */
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0b0b14;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        cursor: pointer;
        transition: opacity 1.5s ease;
      }
      #overlay h1 {
        font-family: 'Zen Kurenaido', sans-serif;
        font-size: 2.5rem;
        margin-bottom: 10px;
        color: var(--accent-soft);
        text-shadow: 0 0 15px var(--accent-warm);
        animation: breathe 3s infinite ease-in-out;
      }
      #overlay p {
        font-family: 'Courier New', monospace;
        font-size: 0.8rem;
        color: #555;
      }

      /* --- ENDING SCREEN --- */
      #ending-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #fffcf9;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 95;
        opacity: 0;
        pointer-events: none;
        transition: opacity 3s ease;
      }
      #ending-screen h1 {
        color: #333;
        font-family: 'Zen Kurenaido', sans-serif;
        font-size: 2.5rem;
      }
      #ending-screen h2 {
        color: #555;
        font-size: 1rem;
        margin-bottom: 30px;
        letter-spacing: 2px;
      }
      #replay-btn {
        background: transparent;
        border: 1px solid #333;
        color: #333;
        padding: 10px 30px;
        font-family: 'Sawarabi Mincho', serif;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      #replay-btn:hover {
        background: #333;
        color: #fff;
      }
      #final-footer {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
        color: #888;
        font-size: 0.7rem;
        font-family: monospace;
        opacity: 0;
        transition: opacity 2s ease 1s;
        z-index: 96;
      }

      /* --- LYRIC CONTAINER --- */
      #lyric-container {
        position: relative;
        z-index: 10;
        padding: 40px;
        width: 80%;
        max-width: 800px;
        transition: opacity 1s ease;
      }
      #jp-text {
        font-size: 2rem;
        font-weight: 500;
        margin-bottom: 20px;
        line-height: 1.6;
        min-height: 80px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        transition: all 0.5s ease;
      }
      #en-text {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.6);
        font-family: 'Zen Kurenaido', sans-serif;
        letter-spacing: 1px;
        min-height: 30px;
        transition: color 2s ease;
      }

      /* --- MOOD STATES --- */
      .mood-night {
        --bg-color: #1a1a2e;
        --text-main: #e0e0e0;
      }
      .mood-night #bg-gradient {
        opacity: 0;
      }

      .mood-sunset {
        --bg-color: #4a2c2c;
      }
      .mood-sunset #bg-gradient {
        background: linear-gradient(0deg, #ff9a62 0%, #4a2c2c 100%);
        opacity: 0.6;
      }

      .mood-twilight {
        --bg-color: #0f0f1a;
      }

      .mood-final {
        --bg-color: #fff5ee;
        --text-main: #333;
      }
      .mood-final #jp-text,
      .mood-final #en-text {
        color: #333;
        text-shadow: none;
        font-weight: bold;
      }

      /* --- TEXT ANIMATION CLASSES --- */
      .anim-fade {
        animation: fadeInUp 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      .anim-glow {
        animation: glowPulse 3s infinite alternate;
        text-shadow: 0 0 10px var(--accent-warm);
      }
      .anim-tremble {
        display: inline-block;
        animation: tremble 4s infinite;
      }
      .anim-blur {
        animation: blurIn 2s ease forwards;
        color: #bbb;
        font-style: italic;
      }

      /* --- KEYFRAMES --- */
      @keyframes floatParticle {
        0% {
          transform: translateY(100vh) translateX(0);
          opacity: 0;
        }
        10% {
          opacity: 0.8;
        }
        90% {
          opacity: 0.8;
        }
        100% {
          transform: translateY(-10vh) translateX(20px);
          opacity: 0;
        }
      }
      @keyframes driftFade {
        0% {
          transform: translateY(20px);
          opacity: 0;
        }
        20% {
          opacity: 0.4;
        }
        80% {
          opacity: 0.4;
        }
        100% {
          transform: translateY(-30px);
          opacity: 0;
        }
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
          filter: blur(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }
      @keyframes glowPulse {
        from {
          text-shadow: 0 0 5px var(--accent-warm);
        }
        to {
          text-shadow: 0 0 20px var(--accent-warm), 0 0 10px white;
        }
      }
      @keyframes tremble {
        0%,
        100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(0.5deg);
        }
        75% {
          transform: rotate(-0.5deg);
        }
      }
      @keyframes blurIn {
        from {
          filter: blur(10px);
          opacity: 0;
        }
        to {
          filter: blur(0);
          opacity: 0.9;
        }
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }

      .visible {
        opacity: 1 !important;
        pointer-events: auto !important;
      }
      .hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* --- GLOBAL NAVBAR STYLES --- */
      #song-nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 20px 30px;
        z-index: 9999; /* Highest priority */
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: opacity 1s ease, transform 1s ease;
        pointer-events: auto;
      }

      /* Hide nav when class is added */
      #song-nav.nav-hidden {
        opacity: 0;
        transform: translateY(-20px);
        pointer-events: none;
      }

      .nav-home {
        text-decoration: none;
        color: inherit; /* Takes color from the specific song's theme */
        opacity: 0.7;
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: sans-serif;
        font-size: 0.9rem;
        letter-spacing: 1px;
        transition: opacity 0.3s;
      }

      .nav-home:hover {
        opacity: 1;
      }

      /* Mobile Responsiveness */
      @media (max-width: 600px) {
        #song-nav {
          padding: 15px;
        }
        .nav-home span {
          display: none;
        } /* Show only icon on mobile */
      }
    </style>
  </head>

    <script>

      function spawnMemory() {
        const span = document.createElement('div');
        span.classList.add('memory-word');
        span.innerText = memories[Math.floor(Math.random() * memories.length)];

        // Random Position around the center but scattered
        const x = 50 + (Math.random() * 60 - 30); // 20% to 80%
        const y = 50 + (Math.random() * 60 - 30);

        span.style.left = `${x}%`;
        span.style.top = `${y}%`;
        span.style.fontSize = `${Math.random() * 1 + 0.8}rem`;

        memoryLayer.appendChild(span);
        setTimeout(() => {
          span.remove();
        }, 6000);
      }

      // Variable to control memory spawning
      let memoryInterval;

      function startMemories(speed = 800) {
        if (!memoryInterval) memoryInterval = setInterval(spawnMemory, speed);
      }
      function stopMemories() {
        clearInterval(memoryInterval);
        memoryInterval = null;

      // =======================================================
      // LOGIC ENGINE
      // =======================================================
      const audio = document.getElementById('audio-player');
      const overlay = document.getElementById('overlay');
      const endingScreen = document.getElementById('ending-screen');
      const replayBtn = document.getElementById('replay-btn');
      const finalFooter = document.getElementById('final-footer');
      const lyricContainer = document.getElementById('lyric-container');
      const songNav = document.getElementById('song-nav');
      const jpDisplay = document.getElementById('jp-text');
      const enDisplay = document.getElementById('en-text');
      const body = document.body;

      let currentLineIndex = -1;

      overlay.addEventListener('click', () => {
        overlay.classList.add('hidden');
        audio.play().catch((e) => alert('Please allow audio autoplay'));
        // Start Intro Memories immediately
        startMemories(1500);
        songNav.classList.add('nav-hidden');
      });

      audio.addEventListener('timeupdate', () => {
        const currentTime = audio.currentTime;
        let activeIndex = -1;

        for (let i = 0; i < lyrics.length; i++) {
          if (currentTime >= lyrics[i].time) activeIndex = i;
          else break;
        }

        if (activeIndex !== -1 && activeIndex !== currentLineIndex) {
          renderLyric(lyrics[activeIndex]);
          currentLineIndex = activeIndex;
        }
      });

      function renderLyric(line) {
        // Mood Change
        body.className = `mood-${line.mood || 'night'}`;

        // GAP HANDLING
        if (line.type === 'gap') {
          jpDisplay.innerText = '';
          enDisplay.innerText = '';
          startMemories(800); // Start showing random words
        } else {
          stopMemories(); // Stop random words when lyrics appear

          // Text Animations
          jpDisplay.className = ''; // Reset anims
          void jpDisplay.offsetWidth; // Trigger reflow
          jpDisplay.classList.add(`anim-${line.anim || 'fade'}`);

          jpDisplay.innerText = line.jp;
          enDisplay.innerText = line.en;
        }
      }

      audio.addEventListener('ended', () => {
        stopMemories();
        lyricContainer.style.opacity = '0';
        endingScreen.classList.add('visible');
        finalFooter.classList.add('visible');
        songNav.classList.remove('nav-hidden');
      });

      replayBtn.addEventListener('click', () => {
        endingScreen.classList.remove('visible');
        finalFooter.classList.remove('visible');
        songNav.classList.add('nav-hidden');
        lyricContainer.style.opacity = '1';
        audio.currentTime = 0;
        audio.play();
        currentLineIndex = -1;
        renderLyric(lyrics[0]);
      });
    </script>
  </body>
</html>

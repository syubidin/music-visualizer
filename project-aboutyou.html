<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About You - The 1975 | Interactive</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='0' y='0' width='64' height='64' rx='16' fill='%23111'/%3E%3Cpath d='M18 32L18 32 M27 20L27 44 M36 14L36 50 M45 20L45 44 M54 32L54 32' stroke='%23ffffff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <style>
      :root {
        --bg-color: #080808;
        --text-main: #e6e6e6;
        --blur-strength: 8px;
        --projector-light: rgba(255, 255, 255, 0.08);
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Bodoni Moda', serif;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        transition: background-color 3s ease;
      }

      /* --- GLOBAL NAVBAR (INTEGRATED) --- */
      #song-nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 20px 30px;
        z-index: 9999;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: opacity 1s ease, transform 1s ease;
        pointer-events: auto;
        mix-blend-mode: difference; /* Makes it visible on white or black */
      }
      #song-nav.nav-hidden {
        opacity: 0;
        transform: translateY(-20px);
        pointer-events: none;
      }

      .nav-home {
        text-decoration: none;
        color: #fff;
        opacity: 0.7;
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: 'Inter', sans-serif;
        font-size: 0.8rem;
        letter-spacing: 1px;
        transition: opacity 0.3s;
      }
      .nav-x {
        color: #fff;
        opacity: 0.6;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
      }
      .nav-x svg {
        width: 18px;
        height: 18px;
      }
      .nav-home:hover,
      .nav-x:hover {
        opacity: 1;
        transform: scale(1.05);
      }

      /* --- ATMOSPHERE: FILM NOIR --- */

      /* 1. Grain */
      body::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.1'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 10;
        opacity: 0.4;
        animation: grainFlicker 0.2s infinite;
      }

      /* 2. Projector Light Beam */
      #projector {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(ellipse at center, var(--projector-light) 0%, transparent 60%);
        z-index: 1;
        pointer-events: none;
        opacity: 0;
        animation: projectorPulse 8s infinite alternate;
      }

      /* 3. The Blur Layer (Gap Filler) */
      #blur-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        backdrop-filter: blur(0px);
        z-index: 20;
        pointer-events: none;
        transition: backdrop-filter 2s ease;
      }

      /* --- LYRICS --- */
      #lyric-container {
        position: relative;
        z-index: 50;
        width: 80%;
        max-width: 1000px;
        perspective: 1000px;
      }

      .lyric-line {
        font-size: 2.5rem;
        font-weight: 400;
        letter-spacing: -1px;
        opacity: 0;
        transform: scale(0.95);
        filter: blur(5px);
        transition: all 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
      }

      .lyric-line.active {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        filter: blur(0);
      }
      .lyric-line.exit {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.1);
        filter: blur(10px);
      }

      /* --- STYLES & EMPHASIS --- */

      /* 1. Cinematic (Verse) */
      .style-cinema {
        font-style: normal;
        color: #ccc;
      }

      /* 2. Forgotten (Chorus - Repetitive) */
      .style-forgotten {
        font-weight: 700;
        color: #fff;
        letter-spacing: 2px;
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
      }

      /* 3. Bridge (Carly's Part - Soft) */
      .style-soft {
        font-family: 'Inter', sans-serif;
        font-weight: 300;
        font-size: 1.8rem;
        color: #aaa;
        letter-spacing: 4px;
        font-style: italic;
      }

      /* 4. Outro Message */
      .outro-msg {
        position: absolute;
        width: 100%;
        text-align: center;
        font-family: 'Bodoni Moda', serif;
        color: #555;
        font-size: 1.5rem;
        opacity: 0;
        animation: driftFade 6s forwards;
      }

      /* --- OVERLAY --- */
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #080808;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 200;
        transition: opacity 1.5s ease;
      }
      #overlay h1 {
        font-size: 3rem;
        font-weight: 400;
        letter-spacing: -2px;
        margin-bottom: 20px;
      }
      #overlay p {
        font-family: 'Inter', sans-serif;
        font-size: 0.8rem;
        letter-spacing: 2px;
        color: #666;
      }

      /* --- ENDING SCREEN --- */
      #ending-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 150;
        opacity: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 3s ease;
      }
      #ending-screen h1 {
        font-family: 'Bodoni Moda', serif;
        font-size: 2rem;
        color: #fff;
        opacity: 0.8;
      }
      #replay-btn {
        background: transparent;
        border: 1px solid #333;
        color: #666;
        padding: 15px 40px;
        font-family: 'Inter', sans-serif;
        letter-spacing: 2px;
        margin-top: 30px;
        cursor: pointer;
        transition: 0.4s;
      }
      #replay-btn:hover {
        border-color: #fff;
        color: #fff;
      }

      #final-footer {
        position: fixed;
        bottom: 30px;
        width: 100%;
        text-align: center;
        font-family: 'Inter', sans-serif;
        font-size: 0.7rem;
        color: #333;
        letter-spacing: 3px;
        z-index: 1000;
        opacity: 0;
        transition: opacity 2s ease 1s;
      }
      .footer-visible {
        opacity: 1 !important;
      }

      /* --- ANIMATIONS --- */
      @keyframes grainFlicker {
        0% {
          transform: translate(0, 0);
        }
        100% {
          transform: translate(-2px, 2px);
        }
      }
      @keyframes projectorPulse {
        0% {
          opacity: 0.3;
          transform: scale(1);
        }
        100% {
          opacity: 0.6;
          transform: scale(1.05);
        }
      }
      @keyframes driftFade {
        0% {
          opacity: 0;
          transform: translateY(20px) scale(0.9);
          filter: blur(5px);
        }
        20% {
          opacity: 0.6;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
        80% {
          opacity: 0.6;
        }
        100% {
          opacity: 0;
          transform: translateY(-30px) scale(1.05);
          filter: blur(10px);
        }
      }

      /* Mobile */
      @media (max-width: 600px) {
        .lyric-line {
          font-size: 1.8rem;
        }
        #song-nav {
          padding: 15px;
        }
        .nav-home span {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <nav id="song-nav">
      <a href="index.html" class="nav-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Library</span>
      </a>
      <a href="https://x.com/syuby" target="_blank" class="nav-x">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
      </a>
    </nav>

    <div id="projector"></div>
    <div id="blur-layer"></div>

    <div id="overlay">
      <h1>About You</h1>
      <p>The 1975</p>
      <p style="margin-top: 40px; font-size: 0.7rem; opacity: 0.5">[ CLICK TO REMEMBER ]</p>
    </div>

    <div id="ending-screen">
      <h1>Do you think I have forgotten?</h1>
      <button id="replay-btn">Replay</button>
    </div>
    <div id="final-footer">from: syuby</div>

    <audio id="audio-player">
      <source src="aboutyou.mp3" type="audio/mpeg" />
    </audio>

    <div id="lyric-container"></div>

    <script>
      const audio = document.getElementById('audio-player');
      const overlay = document.getElementById('overlay');
      const lyricContainer = document.getElementById('lyric-container');
      const blurLayer = document.getElementById('blur-layer');
      const endingScreen = document.getElementById('ending-screen');
      const finalFooter = document.getElementById('final-footer');
      const replayBtn = document.getElementById('replay-btn');
      const songNav = document.getElementById('song-nav');

      let currentLineIndex = -1;
      let outroInterval;

      // --- GAP FILLER: FOCUS PULLING ---
      // Instead of text, the whole screen blurs in and out like a camera lens
      function setFocus(focused) {
        if (focused) {
          blurLayer.style.backdropFilter = 'blur(0px)';
        } else {
          blurLayer.style.backdropFilter = 'blur(5px)'; // Out of focus during gaps
        }
      }

      // --- DATA ---
      const lyrics = [
        { time: 0, text: '', type: 'gap' },
        { time: 44.76, text: 'I know a place', type: 'cinema' },
        { time: 54.54, text: "It's somewhere I go when I need to remember your face", type: 'cinema' },

        { time: 61.27, text: '', type: 'gap' }, // Focus Pull Gap

        { time: 64.01, text: 'We get married in our heads', type: 'cinema' },

        { time: 70.76, text: '', type: 'gap' },

        { time: 74.78, text: 'Something to do while we try to recall how we met', type: 'cinema' },

        { time: 81.51, text: '', type: 'gap' },

        // CHORUS 1 (Escalating)
        { time: 84.11, text: 'Do you think I have forgotten?', type: 'forgotten' },
        { time: 89.12, text: 'Do you think I have forgotten?', type: 'forgotten' },
        { time: 94.14, text: 'Do you think I have forgotten', type: 'forgotten' },
        { time: 99.34, text: 'About you?', type: 'cinema' },

        // BRIDGE (Carly's Part - Soft)
        { time: 104.11, text: "You and I (don't let go)", type: 'soft' },
        { time: 109.15, text: "We're alive (don't let go)", type: 'soft' },
        { time: 114.58, text: 'With nothing to do, I could lay and just look in your eyes', type: 'soft' },

        { time: 124.73, text: "Wait (don't let go)", type: 'soft' },
        { time: 129.16, text: "And pretend (don't let go)", type: 'soft' },
        { time: 134.75, text: "Hold on and hope that we'll find our way back in the end", type: 'soft' },

        { time: 141.54, text: '', type: 'gap' },

        // CHORUS 2
        { time: 144.29, text: 'Do you think I have forgotten?', type: 'forgotten' },
        { time: 149.22, text: 'Do you think I have forgotten?', type: 'forgotten' },
        { time: 154.26, text: 'Do you think I have forgotten', type: 'forgotten' },
        { time: 159.18, text: 'About you?', type: 'cinema' },

        { time: 162.11, text: '', type: 'gap' },

        // CHORUS 3
        { time: 164.15, text: 'Do you think I have forgotten?', type: 'forgotten' },
        { time: 169.16, text: 'Do you think I have forgotten?', type: 'forgotten' },
        { time: 174.1, text: 'Do you think I have forgotten', type: 'forgotten' },
        { time: 179.17, text: 'About you?', type: 'cinema' },

        // BRIDGE 2 (Matty)
        { time: 184.53, text: "And there was something 'bout you that now I can't remember", type: 'cinema' },
        { time: 189.6, text: "It's the same damn thing that made my heart surrender", type: 'cinema' },
        { time: 194.47, text: 'And I miss you on a train, I miss you in the morning', type: 'cinema' },
        { time: 199.55, text: 'I never know what to think about', type: 'cinema' },

        { time: 203.52, text: "I think about you (so don't let go)", type: 'soft' },
        { time: 209.1, text: "About you (so don't let go)", type: 'soft' },

        { time: 214.25, text: 'Do you think I have forgotten', type: 'forgotten' },
        { time: 219.21, text: "About you? (Don't let go)", type: 'soft' },
        { time: 224.27, text: 'About you', type: 'cinema' },
        { time: 229.11, text: 'About you', type: 'cinema' },

        { time: 231.88, text: '', type: 'gap' },

        { time: 234.16, text: 'Do you think I have forgotten', type: 'forgotten' },
        { time: 239.28, text: "About you? (Don't let go)", type: 'soft' },

        // THE LONG OUTRO (INSTRUMENTAL) starts around 4:00 (240s)
        { time: 243.0, text: '', type: 'outro' },
      ];

      // --- OUTRO MESSAGES (INNER MONOLOGUE) ---
      const outroTexts = [
        "I haven't.",
        "It's been so long.",
        'Your face is fading.',
        'But the feeling remains.',
        'Just like a movie.',
        'Stuck in a loop.',
        'Are you happy?',
        'I still know the place.',
        'We got married in our heads.',
        'Remember?',
        "Don't let go.",
        'Please.',
        'Goodbye.',
      ];

      overlay.addEventListener('click', () => {
        overlay.style.opacity = '0';
        setTimeout(() => (overlay.style.display = 'none'), 1500);
        songNav.classList.add('nav-hidden');
        audio.play();
      });

      audio.addEventListener('timeupdate', () => {
        const currentTime = audio.currentTime;
        let activeIndex = -1;
        for (let i = 0; i < lyrics.length; i++) {
          if (currentTime >= lyrics[i].time) activeIndex = i;
          else break;
        }
        if (activeIndex !== -1 && activeIndex !== currentLineIndex) {
          renderLyric(lyrics[activeIndex]);
          currentLineIndex = activeIndex;
        }
      });

      function renderLyric(line) {
        // Remove previous active lyric
        const previous = lyricContainer.querySelector('.lyric-line.active');
        if (previous) {
          previous.classList.remove('active');
          previous.classList.add('exit');
          setTimeout(() => previous.remove(), 2000);
        }

        if (line.type === 'gap') {
          setFocus(false); // Blur the screen
        } else if (line.type === 'outro') {
          setFocus(false); // Blur for dream sequence
          startOutroSequence();
        } else {
          setFocus(true); // Focus on lyric

          // Create new lyric element
          const el = document.createElement('div');
          el.className = `lyric-line style-${line.type}`;
          el.innerText = line.text;
          lyricContainer.appendChild(el);

          // Trigger reflow
          void el.offsetWidth;
          el.classList.add('active');
        }
      }

      // --- OUTRO SEQUENCE LOGIC ---
      function startOutroSequence() {
        let i = 0;
        // Display a new thought every 4 seconds until audio ends
        outroInterval = setInterval(() => {
          if (i >= outroTexts.length) i = 0; // Loop or stop

          const msg = document.createElement('div');
          msg.className = 'outro-msg';
          msg.innerText = outroTexts[i];

          // Random position for "lost in thought" feel
          const top = 30 + Math.random() * 40;
          const left = 10 + Math.random() * 10;
          msg.style.top = `${top}%`;
          // Alternating sides
          msg.style.transform = `translateX(${Math.random() > 0.5 ? -20 : 20}px)`;

          lyricContainer.appendChild(msg);

          // Remove from DOM after animation
          setTimeout(() => msg.remove(), 6000);
          i++;
        }, 4000);
      }

      audio.addEventListener('ended', () => {
        clearInterval(outroInterval);
        lyricContainer.innerHTML = ''; // Clear all thoughts
        endingScreen.classList.add('visible-block');
        // Manual fade in for ending screen because of the class structure
        endingScreen.style.opacity = '1';
        endingScreen.style.pointerEvents = 'auto';
        finalFooter.classList.add('footer-visible');
        songNav.classList.remove('nav-hidden');
      });

      replayBtn.addEventListener('click', () => {
        endingScreen.style.opacity = '0';
        endingScreen.style.pointerEvents = 'none';
        finalFooter.classList.remove('footer-visible');
        songNav.classList.add('nav-hidden');

        clearInterval(outroInterval);
        lyricContainer.innerHTML = '';

        audio.currentTime = 0;
        audio.play();
        currentLineIndex = -1;
        renderLyric(lyrics[0]);
      });
    </script>
  </body>
</html>

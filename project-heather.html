<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heather - Conan Gray | Interactive</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='0' y='0' width='64' height='64' rx='16' fill='%23111'/%3E%3Cpath d='M18 32L18 32 M27 20L27 44 M36 14L36 50 M45 20L45 44 M54 32L54 32' stroke='%23ffffff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Reenie+Beanie&family=Cinzel:wght@400&display=swap" rel="stylesheet" />
    <style>
      :root {
        --c-void: #08090b;
        --c-cold-gray: #2c333a;
        --c-heather: #fff8e1; /* Angelic glow */
        --c-polyester: #555;
        --c-jealousy: #0f0505;
        --c-text: #d1d5db;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--c-void);
        color: var(--c-text);
        font-family: 'Playfair Display', serif;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        transition: background-color 2.5s ease-in-out;
      }

      /* --- ATMOSPHERE LAYERS --- */

      /* 1. Heavy Noise (Vintage/Depressive) */
      body::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.07'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 10;
        opacity: 0.5;
        mix-blend-mode: overlay;
      }

      /* 2. Vignette (Dark Corners) */
      .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, transparent 40%, #000 120%);
        pointer-events: none;
        z-index: 9;
      }

      /* 3. The Sweater Lint (Particles) */
      #dust-container {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 2;
        pointer-events: none;
      }
      .lint {
        position: absolute;
        background: rgba(255, 255, 255, 0.15);
        width: 1px;
        height: 3px;
        transform: rotate(45deg);
        animation: floatLint linear infinite;
      }

      /* 4. Intrusive Thoughts (Gap Filler) */
      #thought-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 5;
        pointer-events: none;
      }
      .thought-word {
        position: absolute;
        font-family: 'Reenie Beanie', cursive;
        font-size: 2rem;
        color: rgba(255, 255, 255, 0.15);
        filter: blur(1px);
        animation: fadeThinking 5s ease-out forwards;
        transform-origin: center;
      }

      /* --- OVERLAY --- */
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #050505;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 200;
        cursor: pointer;
        transition: opacity 1.5s ease;
      }
      #overlay h1 {
        font-size: 3.5rem;
        font-style: italic;
        color: #aaa;
        margin-bottom: 5px;
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
      }

      /* --- ENDING --- */
      #ending-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #1a1a1a;
        z-index: 150;
        opacity: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 3s ease;
      }
      #ending-screen h1 {
        font-family: 'Reenie Beanie', cursive;
        font-size: 3rem;
        color: #eee;
        margin-bottom: 20px;
        transform: rotate(-2deg);
      }
      #replay-btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #888;
        padding: 12px 40px;
        font-family: 'Playfair Display', serif;
        letter-spacing: 1px;
        cursor: pointer;
        transition: 0.4s;
      }
      #replay-btn:hover {
        border-color: #fff;
        color: #fff;
      }

      /* --- FIXED FOOTER --- */
      #final-footer {
        position: fixed;
        bottom: 25px;
        width: 100%;
        text-align: center;
        font-family: 'Cinzel', serif;
        font-size: 0.7rem;
        color: #444;
        letter-spacing: 3px;
        z-index: 1000;
        opacity: 0;
        transition: opacity 2s ease 1s;
      }
      .footer-visible {
        opacity: 1 !important;
      }

      /* --- LYRIC STAGE --- */
      #lyric-stage {
        position: relative;
        z-index: 50;
        width: 85%;
        max-width: 900px;
        height: 200px; /* Fixed height container to center lines */
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* The Wrapper for a single lyric line (JP + EN) */
      .lyric-wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.5s ease, transform 1.5s ease-out, filter 1.5s ease;
        will-change: opacity, transform;
      }

      .lyric-wrapper.active {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        filter: blur(0);
      }

      .lyric-wrapper.exit {
        opacity: 0;
        transform: translate(-50%, -60%) scale(1.05);
        filter: blur(5px);
      }

      .jp-line {
        display: block;
        font-size: 1rem;
        color: #666;
        margin-bottom: 15px;
        letter-spacing: 1px;
        font-weight: 400;
      }
      .en-line {
        display: block;
        font-size: 2.2rem;
        font-weight: 400;
        line-height: 1.3;
        color: var(--c-text);
      }

      /* --- MOODS --- */
      .mood-void {
        background-color: #08090b;
      }
      .mood-cold {
        background-color: #1a222b;
      }
      .mood-heather {
        background-color: #4a4a4a;
      }
      .mood-dark {
        background-color: #000;
      }
      .mood-wish {
        background-color: #1e1e1e;
      }

      /* --- TEXT STYLES --- */
      .style-heather .en-line {
        color: var(--c-heather);
        text-shadow: 0 0 20px rgba(255, 248, 225, 0.5);
        font-style: italic;
        transform: scale(1.05);
      }
      .style-cold .en-line {
        color: #a2bce0;
        text-shadow: 0 0 10px rgba(66, 133, 244, 0.2);
      }
      .style-dark .en-line {
        color: #333;
        text-shadow: -1px -1px 0 #555;
        letter-spacing: 2px;
      }
      .style-static .en-line {
        font-family: monospace;
        color: #888;
        letter-spacing: -1px;
      }
      .style-wish .en-line {
        font-weight: 300;
        opacity: 0.8;
        letter-spacing: 3px;
      }

      /* --- ANIMATIONS --- */
      @keyframes floatLint {
        0% {
          transform: translateY(0) rotate(45deg);
          opacity: 0;
        }
        20% {
          opacity: 0.6;
        }
        100% {
          transform: translateY(100px) rotate(90deg);
          opacity: 0;
        }
      }
      @keyframes fadeThinking {
        0% {
          opacity: 0;
          transform: scale(0.9) rotate(0deg);
        }
        30% {
          opacity: 0.4;
        }
        100% {
          opacity: 0;
          transform: scale(1.1) rotate(5deg);
          filter: blur(3px);
        }
      }

      .visible-block {
        opacity: 1 !important;
        pointer-events: auto !important;
      }
      .hidden {
        opacity: 0;
        pointer-events: none;
      }

      @media (max-width: 600px) {
        .en-line {
          font-size: 1.6rem;
        }
        .jp-line {
          font-size: 0.9rem;
        }
      }
      /* --- GLOBAL NAVBAR STYLES --- */
      #song-nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 20px 30px;
        z-index: 9999; /* Highest priority */
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: opacity 1s ease, transform 1s ease;
        pointer-events: auto;
      }

      /* Hide nav when class is added */
      #song-nav.nav-hidden {
        opacity: 0;
        transform: translateY(-20px);
        pointer-events: none;
      }

      .nav-home {
        text-decoration: none;
        color: inherit; /* Takes color from the specific song's theme */
        opacity: 0.7;
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: sans-serif;
        font-size: 0.9rem;
        letter-spacing: 1px;
        transition: opacity 0.3s;
      }

      .nav-home:hover {
        opacity: 1;
      }

      /* Mobile Responsiveness */
      @media (max-width: 600px) {
        #song-nav {
          padding: 15px;
        }
        .nav-home span {
          display: none;
        } /* Show only icon on mobile */
      }
    </style>
  </head>
  <body class="mood-void">
    <nav id="song-nav">
      <a href="index.html" class="nav-home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Library</span>
      </a>
    </nav>
    <div class="vignette"></div>
    <div id="dust-container"></div>
    <div id="thought-layer"></div>

    <div id="overlay">
      <h1>Heather</h1>
      <p style="letter-spacing: 3px; font-size: 0.8rem; color: #555; margin-top: 10px">3RD OF DECEMBER</p>
      <p style="font-size: 0.7rem; margin-top: 40px; opacity: 0.4">[ CLICK TO REMEMBER ]</p>
    </div>

    <div id="ending-screen">
      <h1>I wish I were Heather.</h1>
      <p style="font-size: 0.9rem; color: #555; font-family: 'Cinzel', serif">NOSTALGIA FADED</p>
      <button id="replay-btn">Replay Memory</button>
    </div>

    <div id="final-footer">from: syuby</div>

    <audio id="audio-player">
      <source src="heather.mp3" type="audio/mpeg" />
    </audio>

    <div id="lyric-stage"></div>

    <script>
      // =======================================================
      // PARTICLE SYSTEM: SWEATER LINT
      // =======================================================
      const dustContainer = document.getElementById('dust-container');
      function createLint() {
        const lint = document.createElement('div');
        lint.classList.add('lint');
        lint.style.left = `${Math.random() * 100}%`;
        lint.style.top = `${Math.random() * 100}%`;
        lint.style.animationDuration = `${Math.random() * 5 + 5}s`;
        dustContainer.appendChild(lint);
        setTimeout(() => lint.remove(), 10000);
      }
      setInterval(createLint, 200);

      // =======================================================
      // GAP FILLER: INTRUSIVE THOUGHTS
      // =======================================================
      const thoughtLayer = document.getElementById('thought-layer');
      const thoughts = ['why her?', 'so pretty', 'it hurts', 'polyester', 'december 3rd', 'angel', 'please', 'look at me', 'cold', 'blue', 'disappear', 'invisible', 'fake', 'wish', 'hate'];
      let thoughtInterval;

      function spawnThought() {
        const el = document.createElement('div');
        el.classList.add('thought-word');
        el.innerText = thoughts[Math.floor(Math.random() * thoughts.length)];

        // Random chaotic placement
        const x = 50 + (Math.random() * 60 - 30);
        const y = 50 + (Math.random() * 60 - 30);
        el.style.left = `${x}%`;
        el.style.top = `${y}%`;

        const rot = Math.random() * 30 - 15;
        el.style.transform = `rotate(${rot}deg)`;

        thoughtLayer.appendChild(el);
        setTimeout(() => el.remove(), 5000);
      }

      function startGapMode() {
        if (!thoughtInterval) thoughtInterval = setInterval(spawnThought, 1000);
      }
      function stopGapMode() {
        clearInterval(thoughtInterval);
        thoughtInterval = null;
        // Optionally clear specific visual cues, but fading out naturally is better
      }

      // =======================================================
      // LYRIC DATA
      // =======================================================
      const lyrics = [
        { time: 0, jp: '', en: '', type: 'gap' },

        // VERSE 1
        { time: 24.54, jp: '12月3日のことをまだ覚えてる', en: 'I still remember the third of December', type: 'normal' },
        { time: 29.0, jp: 'あなたのセーターを着た私', en: 'Me in your sweater', type: 'normal' },
        { time: 32.08, jp: 'あなたより私の方が似合うって言ったよね', en: 'You said it looked better on me than it did you', type: 'normal' },
        { time: 37.64, jp: '私がどれだけ好きだったか知ってたらな', en: 'Only if you knew how much I liked you', type: 'wish' },

        { time: 42.61, jp: 'でも私はあなたの目を見つめる', en: 'But I watch your eyes as she', type: 'normal' },
        { time: 45.47, jp: '通り過ぎる', en: 'Walks by', type: 'normal' },

        { time: 47.92, jp: '目の保養になる光景', en: 'What a sight for sore eyes', type: 'heather' },
        { time: 53.12, jp: '青空よりも眩しい', en: 'Brighter than the blue sky', type: 'heather' },
        { time: 58.34, jp: '彼女はあなたを魅了し、私は死んでいく', en: "She's got you mesmerized while I die", type: 'dark' },

        // CHORUS 1
        { time: 66.26, jp: 'どうして私にキスなんてしたの？', en: 'Why would you ever kiss me?', type: 'cold' },
        { time: 71.08, jp: '私は半分も可愛くないのに', en: "I'm not even half as pretty", type: 'cold' },
        { time: 76.29, jp: '彼女にセーターをあげたんだね', en: 'You gave her your sweater', type: 'normal' },
        { time: 79.0, jp: 'ただのポリエステルなのに', en: "It's just polyester", type: 'static' },
        { time: 81.48, jp: 'でも彼女の方がいいんだね', en: 'But you like her better', type: 'normal' },

        { time: 84.52, jp: 'ヘザーになれたらよかった', en: 'Wish I were Heather', type: 'heather' },

        // VERSE 2
        { time: 87.52, jp: '彼女が彼と一緒に立っているのを見る', en: 'Watch as she stands with her, holding your hand', type: 'normal' },
        { time: 91.68, jp: '彼女の肩に腕を回して', en: "Put your arm 'round her shoulder", type: 'normal' },
        { time: 95.0, jp: '私はどんどん冷えていく', en: "Now I'm getting colder", type: 'cold' },

        { time: 97.28, jp: 'でもどうして彼女を憎める？', en: 'But how could I hate her?', type: 'normal' },
        { time: 100.0, jp: '彼女はまるで天使なのに', en: "She's such an angel", type: 'heather' },

        { time: 102.8, jp: 'でもやっぱり', en: 'But then again,', type: 'normal' },
        { time: 105.0, jp: '彼女が死ねばいいのにと思ってしまう', en: 'Kinda wish she were dead as she', type: 'dark' },

        { time: 108.2, jp: '通り過ぎる', en: 'Walks by', type: 'normal' },
        { time: 110.66, jp: '目の保養になる光景', en: 'What a sight for sore eyes', type: 'heather' },
        { time: 115.93, jp: '青空よりも眩しい', en: 'Brighter than the blue sky', type: 'heather' },
        { time: 121.06, jp: '彼女はあなたを魅了し、私は死んでいく', en: "She's got you mesmerized while I die", type: 'dark' },

        // CHORUS 2
        { time: 128.73, jp: 'どうして私にキスなんてしたの？', en: 'Why would you ever kiss me?', type: 'cold' },
        { time: 133.55, jp: '私は半分も可愛くないのに', en: "I'm not even half as pretty", type: 'cold' },
        { time: 138.95, jp: '彼女にセーターをあげたんだね', en: 'You gave her your sweater', type: 'normal' },
        { time: 142.0, jp: 'ただのポリエステルなのに', en: "It's just polyester", type: 'static' },
        { time: 144.28, jp: 'でも彼女の方がいいんだね', en: 'But you like her better', type: 'normal' },

        { time: 147.07, jp: '私はヘザーになりたい', en: 'I wish I were Heather', type: 'heather' },

        { time: 149.66, jp: '', en: '( oh, oh )', type: 'gap' },

        { time: 157.47, jp: '私はヘザーになりたい', en: 'I wish I were Heather', type: 'heather' },

        { time: 158.96, jp: '', en: '( oh, oh )', type: 'gap' },

        // OUTRO
        { time: 168.02, jp: 'ヘザーになれたらよかった', en: 'Wish I were Heather', type: 'heather' },
        { time: 170.61, jp: 'どうして私にキスなんてしたの？', en: 'Why would you ever kiss me?', type: 'cold' },
        { time: 175.45, jp: '私は半分も可愛くないのに', en: "I'm not even half as pretty", type: 'cold' },
        { time: 180.64, jp: '彼女にセーターをあげたんだね', en: 'You gave her your sweater', type: 'normal' },
        { time: 184.0, jp: 'ただのポリエステルなのに', en: "It's just polyester", type: 'static' },
        { time: 186.08, jp: 'でも彼女の方がいいんだね', en: 'But you like her better', type: 'normal' },

        { time: 189.05, jp: 'なれたらよかった', en: 'Wish I were', type: 'wish' },

        { time: 195.0, jp: '', en: '', type: 'gap' },
      ];

      // =======================================================
      // LOGIC ENGINE
      // =======================================================
      const audio = document.getElementById('audio-player');
      const overlay = document.getElementById('overlay');
      const endingScreen = document.getElementById('ending-screen');
      const replayBtn = document.getElementById('replay-btn');
      const finalFooter = document.getElementById('final-footer');
      const lyricStage = document.getElementById('lyric-stage');
      const songNav = document.getElementById('song-nav');
      const body = document.body;

      let currentLineIndex = -1;

      overlay.addEventListener('click', () => {
        overlay.style.opacity = '0';
        setTimeout(() => (overlay.style.display = 'none'), 1500);
        audio.play().catch((e) => alert('Please allow audio autoplay'));
        startGapMode();
        songNav.classList.add('nav-hidden');
      });

      audio.addEventListener('timeupdate', () => {
        const currentTime = audio.currentTime;
        let activeIndex = -1;
        for (let i = 0; i < lyrics.length; i++) {
          if (currentTime >= lyrics[i].time) activeIndex = i;
          else break;
        }
        if (activeIndex !== -1 && activeIndex !== currentLineIndex) {
          renderLyric(lyrics[activeIndex]);
          currentLineIndex = activeIndex;
        }
      });

      function renderLyric(line) {
        // 1. CHANGE MOOD (Background Transition)
        // Remove previous specific mood classes, keep base
        body.className = `mood-${line.type || 'void'}`;

        // 2. GAP HANDLING
        if (line.type === 'gap') {
          startGapMode();
          if (line.en) {
            // If it's an ad-lib gap (oh oh), show it delicately
            injectLine(line.jp, line.en, 'style-wish');
          } else {
            // If pure gap, fade out any existing text
            const active = lyricStage.querySelector('.lyric-wrapper.active');
            if (active) {
              active.classList.remove('active');
              active.classList.add('exit');
              setTimeout(() => active.remove(), 1500);
            }
          }
        } else {
          // 3. NORMAL LYRIC HANDLING
          stopGapMode();
          injectLine(line.jp, line.en, `style-${line.type}`);
        }
      }

      // HELPER: Creates new DOM elements for smooth cross-fading
      // This prevents the "jitter" caused by changing innerText on the same element
      function injectLine(jpText, enText, styleClass) {
        // Mark current active as exit
        const oldLines = lyricStage.querySelectorAll('.lyric-wrapper.active');
        oldLines.forEach((el) => {
          el.classList.remove('active');
          el.classList.add('exit');
          setTimeout(() => el.remove(), 1500); // Clean up after transition
        });

        // Create New Line
        const wrapper = document.createElement('div');
        wrapper.className = `lyric-wrapper ${styleClass}`;

        const jpSpan = document.createElement('span');
        jpSpan.className = 'jp-line';
        jpSpan.innerText = jpText;

        const enSpan = document.createElement('span');
        enSpan.className = 'en-line';
        enSpan.innerText = enText;

        wrapper.appendChild(jpSpan);
        wrapper.appendChild(enSpan);
        lyricStage.appendChild(wrapper);

        // Trigger Reflow/Animation
        void wrapper.offsetWidth;
        wrapper.classList.add('active');
      }

      // ENDING
      audio.addEventListener('ended', () => {
        stopGapMode();
        // Clear stage
        lyricStage.innerHTML = '';

        endingScreen.classList.add('visible-block');
        finalFooter.classList.add('visible-block');
        songNav.classList.remove('nav-hidden');
      });

      // REPLAY (FIXED)
      replayBtn.addEventListener('click', () => {
        // 1. Reset UI
        endingScreen.classList.remove('visible-block');
        finalFooter.classList.remove('visible-block');
        songNav.classList.add('nav-hidden');

        // 2. Hard Clear Lyrics
        lyricStage.innerHTML = '';

        // 3. Reset Audio & Logic
        audio.currentTime = 0;
        audio.play();
        currentLineIndex = -1;

        // 4. Start first gap logic manually if needed, or let timeupdate handle it
        startGapMode();
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Heather - Conan Gray | Interactive</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700;1,900&family=Reenie+Beanie&family=Cinzel:wght@400;700&family=Cutive+Mono&display=swap" rel="stylesheet" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='0' y='0' width='64' height='64' rx='16' fill='%232b2b2b'/%3E%3Cpath d='M18 32L18 32 M27 20L27 44 M36 14L36 50 M45 20L45 44 M54 32L54 32' stroke='%23d3d3d3' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <style>
      :root {
        --bg-void: #08090a;
        --bg-cold: #121820;
        --bg-heather: #555;
        --bg-bloom: #f0f0f0;
        --angel-glow: #fffacd;
        --text-main: #e2e2e2;
      }

      /* --- MOBILE LOCK & RESET --- */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-void);
        color: var(--text-main);
        font-family: 'Playfair Display', serif;
        overflow: hidden; /* No scroll */
        position: fixed; /* Lock bounce on iOS */
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        transition: background-color 2s cubic-bezier(0.25, 0.8, 0.25, 1);
        user-select: none;
      }

      /* --- ATMOSPHERE LAYERS --- */

      /* 1. Cinematic Grain */
      body::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 10;
        opacity: 0.6;
        mix-blend-mode: overlay;
      }

      /* 2. Cold Vignette */
      .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, transparent 30%, rgba(0, 0, 0, 0.95) 120%);
        pointer-events: none;
        z-index: 9;
        transition: opacity 2s;
      }

      /* 3. The "Heather" Bloom Light */
      #angel-bloom {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(255, 250, 220, 0.2), transparent 70%);
        opacity: 0;
        transition: opacity 2s ease, transform 10s linear;
        z-index: 1;
        pointer-events: none;
      }

      /* 4. Snow/Dust */
      #particle-layer {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 2;
        pointer-events: none;
      }
      .particle {
        position: absolute;
        background: white;
        border-radius: 50%;
        opacity: 0.3;
        animation: fall linear infinite;
      }

      /* 5. Breath/Gap Text Layer */
      #breath-layer {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 5;
        pointer-events: none;
      }
      .breath-word {
        position: absolute;
        font-family: 'Reenie Beanie', cursive;
        font-size: 2.2rem;
        color: rgba(255, 255, 255, 0.25);
        animation: floatBreath 5.5s ease-out forwards;
        /* Reduced blur so it's readable */
        filter: blur(0px);
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
      }

      /* --- UI ELEMENTS --- */
      #song-nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 20px 30px;
        z-index: 9999;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: opacity 1s ease, transform 1s ease;
        pointer-events: auto;
      }
      #song-nav.nav-hidden {
        opacity: 0;
        transform: translateY(-20px);
        pointer-events: none;
      }
      .nav-home,
      .nav-x {
        color: #888;
        text-decoration: none;
        opacity: 0.7;
        transition: 0.3s;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .nav-home:hover,
      .nav-x:hover {
        opacity: 1;
        color: #fff;
      }

      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #08090a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 200;
        transition: opacity 1.5s ease, visibility 1.5s;
      }
      #overlay h1 {
        font-size: 4rem;
        font-style: italic;
        color: #d1d1d1;
        margin-bottom: 5px;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      }
      #overlay p {
        font-size: 0.7rem;
        letter-spacing: 4px;
        color: #666;
        margin-top: 30px;
        animation: pulse 3s infinite;
      }

      /* --- ENDING SCREEN (Fixed) --- */
      #ending-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #111;
        z-index: 5000; /* Super high Z-index */
        opacity: 0;
        visibility: hidden; /* Start hidden */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 2s ease, visibility 0s 0s; /* Instant visibility toggle, slow opacity */
      }
      #ending-screen h1 {
        font-family: 'Reenie Beanie', cursive;
        font-size: 3.5rem;
        color: #eee;
        margin-bottom: 20px;
        transform: rotate(-3deg);
      }
      #replay-btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #bbb;
        padding: 12px 40px;
        font-family: 'Playfair Display', serif;
        letter-spacing: 2px;
        cursor: pointer;
        transition: 0.4s;
      }
      #replay-btn:hover {
        border-color: #fff;
        color: #fff;
        background: rgba(255, 255, 255, 0.05);
      }

      /* Fixed Footer */
      #final-footer {
        position: fixed;
        bottom: 30px;
        width: 100%;
        text-align: center;
        font-family: 'Cinzel', serif;
        font-size: 0.8rem;
        color: #444;
        letter-spacing: 3px;
        z-index: 6000; /* Above ending screen */
        opacity: 0;
        transition: opacity 2s ease 1s;
      }

      /* Show Classes */
      .show-ending {
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto !important;
      }
      .show-footer {
        opacity: 1 !important;
        color: #888 !important;
      } /* Make brighter when shown */

      /* --- LYRIC STAGE --- */
      #lyric-stage {
        position: relative;
        z-index: 50;
        width: 85%;
        max-width: 800px;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
      }

      /* Lyric Element Wrapper */
      .lyric-wrapper {
        position: absolute;
        width: 100%;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease, transform 1.2s ease, filter 1.2s ease;
        will-change: opacity, transform;
      }
      .lyric-wrapper.active {
        opacity: 1;
        transform: scale(1) translateZ(0);
        filter: blur(0);
      }
      .lyric-wrapper.exit {
        opacity: 0;
        transform: scale(1.05) translateZ(-50px);
        filter: blur(6px);
      }

      .en-line {
        display: block;
        font-size: 2.3rem;
        font-weight: 400;
        line-height: 1.3;
        margin-bottom: 12px;
      }
      .jp-line {
        display: block;
        font-size: 1rem;
        color: #777;
        font-weight: 300;
        letter-spacing: 1px;
        font-family: sans-serif;
      }

      /* --- MOODS & STYLES --- */

      /* Background Moods */
      .mood-void {
        background-color: #08090a;
      }
      .mood-cold {
        background-color: #121820;
      }
      .mood-heather {
        background-color: #555;
      }
      .mood-dark {
        background-color: #000;
      }
      .mood-wish {
        background-color: #1c1c1c;
      }

      /* Lyric Styles */
      .style-heather .en-line {
        color: var(--angel-glow);
        text-shadow: 0 0 35px rgba(255, 250, 205, 0.7);
        font-style: italic;
        transform: scale(1.05);
        font-weight: 700;
      }
      .mood-heather #angel-bloom {
        opacity: 0.7;
        animation: rotateLight 20s linear infinite;
      }

      .style-cold .en-line {
        color: #b0c4de;
        text-shadow: 0 0 15px rgba(176, 196, 222, 0.3);
        animation: shiver 0.2s infinite;
      }
      .mood-cold {
        background-color: var(--bg-cold) !important;
      }

      .style-static .en-line {
        font-family: 'Cutive Mono', monospace;
        color: #999;
        letter-spacing: -1px;
        text-shadow: 2px 0 0 rgba(0, 0, 0, 0.8);
        opacity: 0.9;
      }

      .style-dark .en-line {
        color: #111;
        text-shadow: -1px -1px 0 #333;
        font-weight: 900;
        letter-spacing: 4px;
        animation: flicker 0.1s infinite;
      }
      .mood-dark {
        background-color: #000 !important;
      }

      /* --- THE CLIMAX (OVEREXPOSURE) --- */
      .mood-bloom {
        background-color: var(--bg-bloom) !important;
        animation: screenShake 0.2s infinite; /* Whole screen shakes */
      }
      .mood-bloom .vignette {
        opacity: 0;
      }
      .mood-bloom #angel-bloom {
        opacity: 1;
        transform: scale(2.5);
        background: radial-gradient(circle, rgba(255, 255, 240, 0.9), transparent 80%);
      }
      .mood-bloom .particle {
        background: #000;
      }

      .style-bloom .en-line {
        color: #000;
        font-size: 3.8rem;
        font-weight: 900;
        font-style: italic;
        text-shadow: 0 0 60px rgba(255, 215, 0, 0.8), 2px 2px 0px rgba(0, 0, 0, 0.2);
        animation: breathe 0.2s ease-in-out infinite alternate;
      }
      .style-bloom .jp-line {
        color: #333;
        font-weight: bold;
        letter-spacing: 4px;
      }

      /* --- KEYFRAMES --- */
      @keyframes rotateLight {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes fall {
        from {
          transform: translateY(-10vh);
          opacity: 0;
        }
        20% {
          opacity: 0.6;
        }
        to {
          transform: translateY(110vh);
          opacity: 0;
        }
      }
      @keyframes floatBreath {
        0% {
          opacity: 0;
          transform: translateY(20px) scale(0.9);
        }
        20% {
          opacity: 0.7;
        } /* Higher opacity */
        100% {
          opacity: 0;
          transform: translateY(-50px) scale(1.2);
          filter: blur(4px);
        }
      }
      @keyframes shiver {
        0% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(1px, 1px);
        }
        50% {
          transform: translate(0, 0);
        }
        75% {
          transform: translate(-1px, 0);
        }
        100% {
          transform: translate(0, 0);
        }
      }
      @keyframes flicker {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
        100% {
          opacity: 1;
        }
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.02);
        }
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      @keyframes screenShake {
        0% {
          transform: translate(1px, 1px);
        }
        50% {
          transform: translate(-1px, -1px);
        }
        100% {
          transform: translate(1px, -1px);
        }
      }

      @media (max-width: 600px) {
        .en-line {
          font-size: 1.8rem;
        }
        .style-bloom .en-line {
          font-size: 2.2rem;
        }
      }
    </style>
  </head>

    <script>
      const audio = document.getElementById('audio-player');
      const overlay = document.getElementById('overlay');
      const lyricStage = document.getElementById('lyric-stage');
      const breathLayer = document.getElementById('breath-layer');
      const endingScreen = document.getElementById('ending-screen');
      const finalFooter = document.getElementById('final-footer');
      const replayBtn = document.getElementById('replay-btn');
      const songNav = document.getElementById('song-nav');

      let currentLineIndex = -1;
      let breathInterval;

      // --- PARTICLES ---
      function spawnParticle() {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 3 + 1;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.left = `${Math.random() * 100}%`;
        p.style.animationDuration = `${Math.random() * 5 + 5}s`;
        document.getElementById('particle-layer').appendChild(p);
        setTimeout(() => p.remove(), 10000);
      }
      setInterval(spawnParticle, 300);

      // --- GAP FILLER: BREATH TEXT ---
      const thoughts = ['why her?', 'so pretty', 'it hurts', 'polyester', 'invisible', 'cold', 'blue', 'please'];

      function spawnBreath(text) {
        const el = document.createElement('div');
        el.className = 'breath-word';
        el.innerText = text || thoughts[Math.floor(Math.random() * thoughts.length)];
        el.style.left = `${15 + Math.random() * 70}%`;
        el.style.top = `${25 + Math.random() * 50}%`;
        el.style.transform = `rotate(${Math.random() * 20 - 10}deg)`;
        breathLayer.appendChild(el);
        setTimeout(() => el.remove(), 6000);
      }

      function startBreathMode(specificText = null) {
        if (!breathInterval) {
          spawnBreath(specificText);
          breathInterval = setInterval(() => spawnBreath(specificText), 2200);
        }
      }
      function stopBreathMode() {
        clearInterval(breathInterval);
        breathInterval = null;
      }

      // --- DATA ---
      const lyrics = [
        { time: 0, type: 'gap', note: 'i still remember...' },

        { time: 32.08, jp: 'あなたより私の方が似合うって言ったよね', en: 'You said it looked better on me than it did you', type: 'normal' },
        { time: 37.64, jp: '私がどれだけ好きだったか知ってたらな', en: 'Only if you knew how much I liked you', type: 'wish' },

        { time: 42.61, jp: 'でも私はあなたの目を見つめる', en: 'But I watch your eyes as she', type: 'normal' },

        { time: 47.92, jp: '目の保養になる光景', en: 'What a sight for sore eyes', type: 'heather' },
        { time: 53.12, jp: '青空よりも眩しい', en: 'Brighter than the blue sky', type: 'heather' },
        { time: 58.34, jp: '彼女はあなたを魅了し、私は死んでいく', en: "She's got you mesmerized while I die", type: 'dark' },

        // CHORUS 1
        { time: 66.26, jp: 'どうして私にキスなんてしたの？', en: 'Why would you ever kiss me?', type: 'cold' },
        { time: 71.08, jp: '私は半分も可愛くないのに', en: "I'm not even half as pretty", type: 'cold' },
        { time: 76.29, jp: '彼女にセーターをあげたんだね', en: 'You gave her your sweater', type: 'normal' },
        { time: 79.0, jp: 'ただのポリエステルなのに', en: "It's just polyester", type: 'static' },
        { time: 81.48, jp: 'でも彼女の方がいいんだね', en: 'But you like her better', type: 'normal' },

        { time: 84.52, jp: 'ヘザーになれたらよかった', en: 'Wish I were Heather', type: 'heather' },

        // VERSE 2
        { time: 87.52, jp: '彼女が彼と一緒に立っているのを見る', en: 'Watch as she stands with her, holding your hand', type: 'normal' },
        { time: 91.68, jp: '彼女の肩に腕を回して', en: "Put your arm 'round her shoulder", type: 'normal' },
        { time: 95.0, jp: '私はどんどん冷えていく', en: "Now I'm getting colder", type: 'cold' },

        { time: 97.28, jp: 'でもどうして彼女を憎める？', en: 'But how could I hate her?', type: 'normal' },
        { time: 100.0, jp: '彼女はまるで天使なのに', en: "She's such an angel", type: 'heather' },

        { time: 102.8, jp: 'でもやっぱり', en: 'But then again,', type: 'normal' },
        { time: 105.0, jp: '彼女が死ねばいいのにと思ってしまう', en: 'Kinda wish she were dead as she', type: 'dark' },

        { time: 180.64, jp: '彼女にセーターをあげたんだね', en: 'You gave her your sweater', type: 'normal' },
        { time: 184.0, jp: 'ただのポリエステルなのに', en: "It's just polyester", type: 'static' },

        { time: 195.0, type: 'gap', note: 'goodbye.' },

      overlay.addEventListener('click', () => {
        overlay.style.opacity = '0';
        overlay.style.visibility = 'hidden';
        songNav.classList.add('nav-hidden');
        audio.play();
        startBreathMode("it's getting colder...");
      });

      audio.addEventListener('timeupdate', () => {
        const currentTime = audio.currentTime;
        let activeIndex = -1;
        for (let i = 0; i < lyrics.length; i++) {
          if (currentTime >= lyrics[i].time) activeIndex = i;
          else break;
        }
        if (activeIndex !== -1 && activeIndex !== currentLineIndex) {
          renderLyric(lyrics[activeIndex]);
          currentLineIndex = activeIndex;
        }
      });

      function renderLyric(line) {
        // MOOD HANDLER
        if (line.type === 'bloom') {
          document.body.classList.add('mood-bloom');
        } else {
          document.body.classList.remove('mood-bloom');
          document.body.className = `mood-${line.type || 'void'}`;
        }

        // GAP HANDLER
        if (line.type === 'gap') {
          startBreathMode(line.note);
          // Clear active text
          const activeWrapper = lyricStage.querySelector('.lyric-wrapper.active');
          if (activeWrapper) {
            activeWrapper.classList.remove('active');
            activeWrapper.classList.add('exit');
            setTimeout(() => activeWrapper.remove(), 1500);
          }
        } else {
          stopBreathMode();
          injectLine(line.jp, line.en, `style-${line.type}`);
        }
      }

      // INJECTION METHOD (Layout Stability)
      function injectLine(jpText, enText, styleClass) {
        // Clean up old lines
        const oldLines = lyricStage.querySelectorAll('.lyric-wrapper.active');
        oldLines.forEach((el) => {
          el.classList.remove('active');
          el.classList.add('exit');
          setTimeout(() => el.remove(), 1500);
        });

        const wrapper = document.createElement('div');
        wrapper.className = `lyric-wrapper ${styleClass}`;

        const enSpan = document.createElement('span');
        enSpan.className = 'en-line';
        enSpan.innerText = enText;

        const jpSpan = document.createElement('span');
        jpSpan.className = 'jp-line';
        jpSpan.innerText = jpText;

        wrapper.appendChild(enSpan);
        wrapper.appendChild(jpSpan);
        lyricStage.appendChild(wrapper);

        void wrapper.offsetWidth; // Force Reflow
        wrapper.classList.add('active');
      }

      audio.addEventListener('ended', () => {
        stopBreathMode();
        lyricStage.innerHTML = '';
        document.body.className = 'mood-void';
        document.body.classList.remove('mood-bloom');

        // Show Ending and Footer
        endingScreen.classList.add('show-ending');
        finalFooter.classList.add('show-footer');
        songNav.classList.remove('nav-hidden');
      });

      replayBtn.addEventListener('click', () => {
        endingScreen.classList.remove('show-ending');
        finalFooter.classList.remove('show-footer');
        songNav.classList.add('nav-hidden');

        lyricStage.innerHTML = '';
        audio.currentTime = 0;
        audio.play();
        currentLineIndex = -1;
        renderLyric(lyrics[0]);
      });
    </script>
  </body>
</html>

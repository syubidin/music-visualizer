<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Multo - Cup of Joe | Interactive</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap" rel="stylesheet" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='0' y='0' width='64' height='64' rx='16' fill='%231a1a1a'/%3E%3Cpath d='M18 32L18 32 M27 20L27 44 M36 14L36 50 M45 20L45 44 M54 32L54 32' stroke='%23f0f0f0' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <style>
      :root {
        --bg-dark: #050505;
        --bg-dim: #1a1a1a;
        --text-main: #e0e0e0;
        --text-sub: #888;
        --ghost-color: rgba(255, 255, 255, 0.1);
        --highlight: #b0c4de; /* Light Steel Blue */
      }

      /* LOCK MOBILE */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: 'Crimson Text', serif;
        overflow: hidden;
        position: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        transition: background-color 1s ease;
      }

      /* --- ATMOSPHERE LAYERS --- */

      /* 1. The Light Source (Vignette) */
      #light-source {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 30%, transparent 10%, #000 90%);
        z-index: 2;
        pointer-events: none;
        transition: background 0.5s ease;
      }

      /* 2. Fog/Smoke */
      #fog-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
        z-index: 1;
        pointer-events: none;
        opacity: 0.3;
        animation: drift 20s linear infinite;
      }

      /* 3. Whisper Container */
      #whisper-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
        pointer-events: none;
      }
      .whisper {
        position: absolute;
        font-family: 'Special Elite', cursive;
        font-size: 1.2rem;
        color: var(--ghost-color);
        filter: blur(2px);
        opacity: 0;
        animation: fadeFloat 4s ease-in-out forwards;
      }

      /* --- UI --- */
      #song-nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 20px 30px;
        z-index: 9999;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: opacity 1s ease, transform 1s ease;
        pointer-events: auto;
      }
      #song-nav.nav-hidden {
        opacity: 0;
        transform: translateY(-20px);
        pointer-events: none;
      }
      .nav-home,
      .nav-x {
        color: #888;
        text-decoration: none;
        opacity: 0.6;
        transition: 0.3s;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .nav-home:hover,
      .nav-x:hover {
        opacity: 1;
        color: #fff;
      }

      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 200;
        transition: opacity 1.5s ease;
      }
      #overlay h1 {
        font-size: 3.5rem;
        letter-spacing: 5px;
        margin-bottom: 10px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      }
      #overlay p {
        font-family: 'Special Elite';
        font-size: 0.8rem;
        opacity: 0.5;
        margin-top: 30px;
      }

      #ending-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 150;
        opacity: 0;
        visibility: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 3s ease;
      }
      #ending-screen h1 {
        font-family: 'Special Elite';
        font-size: 1.5rem;
        color: #ccc;
        margin-bottom: 20px;
      }

      #replay-btn {
        background: transparent;
        border: 1px solid #444;
        color: #888;
        padding: 12px 35px;
        font-family: 'Crimson Text', serif;
        letter-spacing: 1px;
        cursor: pointer;
        transition: 0.4s;
      }
      #replay-btn:hover {
        border-color: #fff;
        color: #fff;
      }

      #final-footer {
        position: fixed;
        bottom: 30px;
        width: 100%;
        text-align: center;
        font-family: 'Special Elite', serif;
        font-size: 0.7rem;
        color: #444;
        letter-spacing: 2px;
        z-index: 1000;
        opacity: 0;
        transition: opacity 2s ease 1s;
      }
      .footer-visible {
        opacity: 1 !important;
        color: #666 !important;
      }
      .show-ending {
        opacity: 1 !important;
        visibility: visible !important;
      }

      /* --- LYRICS --- */
      #lyric-container {
        position: relative;
        z-index: 50;
        width: 85%;
        max-width: 900px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 200px;
      }

      /* 3-Tier Lyric System */
      .lyric-tl {
        /* Tagalog */
        font-size: 2.2rem;
        font-weight: 600;
        color: #fff;
        margin-bottom: 15px;
        opacity: 0;
        transform: translateY(10px);
        transition: all 1s ease;
        text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
      }
      .lyric-sub {
        /* EN/ID */
        font-size: 1rem;
        color: #888;
        font-style: italic;
        margin-bottom: 5px;
        opacity: 0;
        transform: translateY(10px);
        transition: all 1.2s ease 0.2s;
        font-family: sans-serif;
        font-weight: 300;
      }

      .visible .lyric-tl {
        opacity: 1;
        transform: translateY(0);
      }
      .visible .lyric-sub {
        opacity: 0.7;
        transform: translateY(0);
      }

      /* --- MOODS --- */

      /* 1. Normal (Dim Room) */
      .mood-normal #light-source {
        background: radial-gradient(circle at 50% 40%, transparent 15%, #050505 85%);
      }

      /* 2. Haunted (Flickering) */
      .mood-haunted #light-source {
        animation: flicker 0.2s infinite alternate;
        background: radial-gradient(circle at 50% 40%, transparent 20%, #0a0505 80%);
      }
      .mood-haunted .lyric-tl {
        text-shadow: 2px 0 0 rgba(255, 0, 0, 0.4), -2px 0 0 rgba(0, 255, 255, 0.4);
      }

      /* 3. Climax (The Ghost) */
      .mood-climax {
        background-color: #080a10;
      }
      .mood-climax #light-source {
        background: radial-gradient(circle at 50% 50%, rgba(200, 200, 255, 0.1) 0%, #000 70%);
        animation: breathe 2s infinite;
      }
      .mood-climax .lyric-tl {
        font-size: 3rem;
        color: #eef;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
        animation: ghostFloat 3s infinite ease-in-out;
      }

      /* 4. Emphasis Words */
      span.highlight {
        color: var(--highlight);
        font-style: italic;
      }

      /* --- ANIMATIONS --- */
      @keyframes drift {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 100px 100px;
        }
      }
      @keyframes fadeFloat {
        0% {
          opacity: 0;
          transform: translateY(10px) scale(0.9);
        }
        30% {
          opacity: 0.4;
        }
        100% {
          opacity: 0;
          transform: translateY(-30px) scale(1.1);
          filter: blur(4px);
        }
      }
      @keyframes flicker {
        0% {
          opacity: 1;
        }
        20% {
          opacity: 0.8;
        }
        40% {
          opacity: 1;
        }
        60% {
          opacity: 0.5;
        }
        80% {
          opacity: 1;
        }
        100% {
          opacity: 0.9;
        }
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.02);
        }
      }
      @keyframes ghostFloat {
        0%,
        100% {
          transform: translateY(0);
          filter: blur(0px);
        }
        50% {
          transform: translateY(-5px);
          filter: blur(1px);
        }
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }

      @media (max-width: 600px) {
        .lyric-tl {
          font-size: 1.6rem;
        }
        .mood-climax .lyric-tl {
          font-size: 2rem;
        }
        .lyric-sub {
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body class="mood-normal">
    <nav id="song-nav">
      <a href="index.html" class="nav-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Library</span>
      </a>
      <a href="https://x.com/syuby" target="_blank" class="nav-x">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
      </a>
    </nav>

    <div id="fog-layer"></div>
    <div id="light-source"></div>
    <div id="whisper-layer"></div>

    <div id="overlay">
      <h1>MULTO</h1>
      <p>CUP OF JOE</p>
      <p style="font-size: 0.6rem; margin-top: 40px; letter-spacing: 2px; color: #666; animation: pulse 2s infinite">[ TAP TO ENTER ]</p>
    </div>

    <div id="ending-screen">
      <h1>"Let me rest..."</h1>
      <p style="color: #666; font-size: 0.8rem; font-style: italic">HINDI NA BA MAMAMAYAPA?</p>
      <button id="replay-btn">Revisit</button>
    </div>

    <div id="final-footer">from: syuby</div>

    <audio id="audio-player">
      <source src="multo.mp3" type="audio/mpeg" />
    </audio>

    <div id="lyric-container">
      <div id="tl-line" class="lyric-tl"></div>
      <div id="en-line" class="lyric-sub"></div>
      <div id="id-line" class="lyric-sub"></div>
    </div>

    <script>
      const audio = document.getElementById('audio-player');
      const overlay = document.getElementById('overlay');
      const lyricContainer = document.getElementById('lyric-container');
      const tlLine = document.getElementById('tl-line');
      const enLine = document.getElementById('en-line');
      const idLine = document.getElementById('id-line');
      const whisperLayer = document.getElementById('whisper-layer');
      const endingScreen = document.getElementById('ending-screen');
      const finalFooter = document.getElementById('final-footer');
      const replayBtn = document.getElementById('replay-btn');
      const songNav = document.getElementById('song-nav');

      let currentLineIndex = -1;
      let whisperInterval;

      // --- WHISPER GENERATOR (GAP FILLER) ---
      const ghosts = ['multo', 'ghost', 'hantu', 'bakit?', 'why?', 'kenapa?', 'nasaan ka?', 'where?', 'dimana?', 'mahal', 'love', 'cinta', 'alis', 'leave', 'pergi', 'dilim', 'dark', 'gelap'];

      function spawnWhisper() {
        const el = document.createElement('div');
        el.className = 'whisper';
        el.innerText = ghosts[Math.floor(Math.random() * ghosts.length)];

        // Random placement but clustered in shadows
        el.style.left = `${Math.random() * 90}%`;
        el.style.top = `${Math.random() * 90}%`;
        el.style.fontSize = `${Math.random() * 1.5 + 0.8}rem`;

        whisperLayer.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }

      function startWhispers() {
        if (!whisperInterval) whisperInterval = setInterval(spawnWhisper, 800);
      }
      function stopWhispers() {
        clearInterval(whisperInterval);
        whisperInterval = null;
      }

      // --- DATA (Trilingual) ---
      const lyrics = [
        { time: 0, type: 'gap' },

        // VERSE 1
        { time: 22.16, tl: 'Humingang malalim, pumikit na muna', en: 'Take a deep breath, close your eyes first', id: 'Tarik napas dalam, pejamkan mata dulu', type: 'normal' },
        { time: 31.75, tl: 'At baka sakaling namamalikmata lang', en: 'Maybe my eyes are just playing tricks', id: 'Mungkin mataku hanya salah lihat', type: 'normal' },
        { time: 40.83, tl: "Ba't nababahala? 'Di ba't ako'y mag-isa?", en: "Why worry? Aren't I alone?", id: 'Kenapa khawatir? Bukankah aku sendiri?', type: 'normal' },
        { time: 50.25, tl: "Kala ko'y payapa, boses mo'y tumatawag pa", en: 'Thought it was peaceful, but your voice still calls', id: 'Kukira damai, suaramu masih memanggil', type: 'haunted' }, // Voice calling

        // PRE-CHORUS
        { time: 59.84, tl: 'Binaon naman na ang lahat', en: "I've buried everything", id: 'Sudah kubur semuanya', type: 'normal' },
        { time: 64.3, tl: "Tinakpan naman na 'king sugat", en: 'Covered up my wounds', id: 'Sudah tutupi lukaku', type: 'normal' },
        { time: 68.87, tl: "Ngunit ba't ba andito pa rin?", en: 'But why are you still here?', id: 'Tapi kenapa masih di sini?', type: 'haunted' },
        { time: 73.87, tl: "Hirap na 'kong intindihin", en: "I'm struggling to understand", id: 'Sulit bagiku mengerti', type: 'normal' },

        { time: 78.01, tl: 'Tanging panalangin, lubayan na sana', en: 'My only prayer, please leave me be', id: 'Satu doaku, tolong tinggalkan aku', type: 'normal' },
        { time: 86.88, tl: "Dahil sa bawat tingin, mukha mo'y nakikita", en: 'Cause in every glance, I see your face', id: 'Karna di setiap tatapan, wajahmu terlihat', type: 'haunted' },
        { time: 96.45, tl: "Kahit sa'n man mapunta ay anino mo'y kumakapit sa 'king kamay", en: 'Wherever I go, your shadow clings to my hand', id: 'Kemanapun pergi, bayanganmu memegang tanganku', type: 'haunted' },

        { time: 105.61, tl: 'Ako ay dahan-dahang nililibing nang buhay pa', en: 'I am slowly being buried alive', id: 'Aku perlahan dikubur hidup-hidup', type: 'normal' },

        // CHORUS 1
        { time: 114.83, tl: 'Hindi na makalaya', en: "Can't break free anymore", id: 'Tak bisa bebas lagi', type: 'climax' },
        { time: 119.41, tl: "Dinadalaw mo 'ko bawat gabi", en: 'You visit me every night', id: 'Kau mengunjungiku tiap malam', type: 'climax' },
        { time: 124.07, tl: 'Wala mang nakikita', en: 'Even if nothing is seen', id: 'Meski tak ada yang terlihat', type: 'normal' },
        { time: 128.69, tl: "Haplos mo'y ramdam pa rin sa dilim", en: 'Your touch is still felt in the dark', id: 'Sentuhanmu masih terasa di gelap', type: 'normal' },

        { time: 133.19, tl: 'Hindi na nananaginip', en: 'No longer dreaming', id: 'Tak lagi bermimpi', type: 'normal' },
        { time: 137.89, tl: 'Hindi na ma-makagising', en: 'Can no longer wake up', id: 'Tak bisa bangun lagi', type: 'normal' },

        { time: 142.52, tl: 'Pasindi na ng ilaw', en: 'Turn on the light', id: 'Nyalakan lampunya', type: 'highlight' }, // Light focus
        { time: 146.93, tl: "Minumulto na 'ko ng damdamin ko", en: "I'm being haunted by my feelings", id: 'Aku dihantui perasaanku', type: 'climax' },

        { time: 153.28, tl: "'Di mo ba ako lilisanin?", en: "Won't you leave me?", id: 'Takkan kau tinggalkan aku?', type: 'normal' },
        { time: 157.25, tl: "Hindi pa ba sapat pagpapahirap sa 'kin?", en: "Isn't the torture enough?", id: 'Belum cukupkah siksaan ini?', type: 'normal' },

        { time: 161.84, tl: 'Hindi na ba ma-mamamayapa?', en: 'Will it never rest?', id: 'Takkan pernah damai?', type: 'haunted' },
        { time: 166.7, tl: 'Hindi na ba ma-mamamayapa?', en: 'Will it never rest?', id: 'Takkan pernah damai?', type: 'haunted' },

        // CHORUS 2 (Same intensity)
        { time: 170.39, tl: 'Hindi na makalaya', en: "Can't break free anymore", id: 'Tak bisa bebas lagi', type: 'climax' },
        { time: 174.62, tl: "Dinadalaw mo 'ko bawat gabi", en: 'You visit me every night', id: 'Kau mengunjungiku tiap malam', type: 'climax' },
        { time: 179.38, tl: 'Wala mang nakikita', en: 'Even if nothing is seen', id: 'Meski tak ada yang terlihat', type: 'normal' },
        { time: 183.95, tl: "Haplos mo'y ramdam pa rin sa dilim", en: 'Your touch is still felt in the dark', id: 'Sentuhanmu masih terasa di gelap', type: 'normal' },

        { time: 188.62, tl: 'Hindi na nananaginip', en: 'No longer dreaming', id: 'Tak lagi bermimpi', type: 'normal' },
        { time: 193.11, tl: 'Hindi na ma-makagising', en: 'Can no longer wake up', id: 'Tak bisa bangun lagi', type: 'normal' },

        { time: 197.62, tl: 'Pasindi na ng ilaw', en: 'Turn on the light', id: 'Nyalakan lampunya', type: 'highlight' },
        { time: 202.49, tl: "Minumulto na 'ko ng damdamin ko", en: "I'm being haunted by my feelings", id: 'Aku dihantui perasaanku', type: 'climax' },

        // OUTRO / ADLIBS (Fading)
        { time: 208.37, tl: '(Makalaya) hindi mo ba ako lilisanin?', en: "(Break free) Won't you leave me?", id: '(Bebas) Takkan kau tinggalkan aku?', type: 'normal' },
        { time: 212.76, tl: "(Dinadalaw mo 'ko...) hindi pa ba sapat?", en: "(Visiting me...) Isn't it enough?", id: '(Mengunjungiku...) Belum cukupkah?', type: 'normal' },
        { time: 217.35, tl: '(Wala mang nakikita) hindi na ba ma-mamamayapa?', en: 'Will it never rest?', id: 'Takkan pernah damai?', type: 'haunted' },
        { time: 221.51, tl: "(Haplos mo'y ramdam...) hindi na ba ma-mamamayapa?", en: 'Will it never rest?', id: 'Takkan pernah damai?', type: 'haunted' },

        { time: 226.65, type: 'gap' }, // END
      ];

      overlay.addEventListener('click', () => {
        overlay.style.opacity = '0';
        setTimeout(() => (overlay.style.display = 'none'), 1500);
        songNav.classList.add('nav-hidden');
        audio.play();
        startWhispers();
      });

      audio.addEventListener('timeupdate', () => {
        const currentTime = audio.currentTime;
        let activeIndex = -1;
        for (let i = 0; i < lyrics.length; i++) {
          if (currentTime >= lyrics[i].time) activeIndex = i;
          else break;
        }
        if (activeIndex !== -1 && activeIndex !== currentLineIndex) {
          renderLyric(lyrics[activeIndex]);
          currentLineIndex = activeIndex;
        }
      });

      function renderLyric(line) {
        // MOOD
        if (line.type === 'climax') document.body.className = 'mood-climax';
        else if (line.type === 'haunted') document.body.className = 'mood-haunted';
        else document.body.className = 'mood-normal';

        // RESET
        lyricContainer.classList.remove('visible');

        // GAP HANDLING
        if (line.type === 'gap') {
          startWhispers();
          return;
        }

        // LYRIC RENDER
        stopWhispers();

        setTimeout(() => {
          tlLine.innerHTML = line.tl;
          enLine.innerHTML = line.en;
          idLine.innerHTML = line.id;

          // Highlight Logic
          if (line.type === 'highlight') {
            tlLine.style.color = 'var(--highlight)';
            tlLine.style.textShadow = '0 0 15px var(--highlight)';
          } else {
            tlLine.style.color = '#fff';
            tlLine.style.textShadow = '0 0 5px rgba(0,0,0,0.8)';
          }

          lyricContainer.classList.add('visible');
        }, 100);
      }

      audio.addEventListener('ended', () => {
        stopWhispers();
        lyricContainer.classList.remove('visible');
        endingScreen.classList.add('show-ending');
        finalFooter.classList.add('footer-visible');
        songNav.classList.remove('nav-hidden');
      });

      replayBtn.addEventListener('click', () => {
        endingScreen.classList.remove('show-ending');
        finalFooter.classList.remove('footer-visible');
        songNav.classList.add('nav-hidden');

        audio.currentTime = 0;
        audio.play();
        currentLineIndex = -1;
        renderLyric(lyrics[0]);
      });
    </script>
  </body>
</html>

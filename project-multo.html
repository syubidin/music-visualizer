<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Multo - Cup of Joe | Interactive</title>

    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Creepster&display=swap" rel="stylesheet" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='0' y='0' width='64' height='64' rx='16' fill='%23050505'/%3E%3Cpath d='M18 32L18 32 M27 20L27 44 M36 14L36 50 M45 20L45 44 M54 32L54 32' stroke='%23666' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <style>
      :root {
        --bg-void: #020202;
        --text-main: #d1d1d1;
        --text-ghost: #444;
        --spotlight-color: rgba(255, 255, 255, 0.08);
        --glitch-red: #ff003c;
        --glitch-blue: #00f0ff;
      }

      /* RESET & LOCK */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-void);
        color: var(--text-main);
        font-family: 'Crimson Text', serif;
        overflow: hidden;
        position: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        transition: background-color 0.2s;
      }

      /* --- ATMOSPHERE LAYERS --- */

      /* 1. Grain/Noise */
      body::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 10;
        opacity: 0.4;
      }

      /* 2. The Flashlight Beam */
      #flashlight {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 50%, var(--spotlight-color) 0%, transparent 60%);
        z-index: 1;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1s ease, transform 0.2s linear;
        mix-blend-mode: screen;
      }

      /* 3. Shadow Figures (Gap Filler) */
      #shadow-realm {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 2;
        pointer-events: none;
        overflow: hidden;
      }
      .shadow-entity {
        position: absolute;
        width: 150px;
        height: 300px;
        background: rgba(0, 0, 0, 0.8);
        filter: blur(20px);
        border-radius: 50%;
        animation: shadowPass 3s linear forwards;
      }

      /* --- UI --- */
      #song-nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 20px 30px;
        z-index: 9999;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: opacity 1s ease;
        pointer-events: auto;
        mix-blend-mode: difference;
      }
      #song-nav.nav-hidden {
        opacity: 0;
        transform: translateY(-20px);
        pointer-events: none;
      }
      .nav-home,
      .nav-x {
        color: #888;
        text-decoration: none;
        opacity: 0.6;
        transition: 0.3s;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .nav-home:hover,
      .nav-x:hover {
        opacity: 1;
        color: #fff;
      }

      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #020202;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 200;
        transition: opacity 1.5s ease;
      }
      #overlay h1 {
        font-family: 'Special Elite', cursive;
        font-size: 4rem;
        letter-spacing: 5px;
        color: #ddd;
        margin-bottom: 5px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      }
      #overlay p {
        font-size: 0.7rem;
        color: #555;
        margin-top: 40px;
        animation: flicker 4s infinite;
      }

      /* --- ENDING --- */
      #ending-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 150;
        opacity: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 3s ease;
      }
      #ending-screen h1 {
        font-family: 'Special Elite', cursive;
        font-size: 1.5rem;
        color: #888;
        margin-bottom: 20px;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
      }
      #replay-btn {
        background: transparent;
        border: 1px solid #333;
        color: #666;
        padding: 12px 35px;
        font-family: 'Crimson Text', serif;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s;
      }
      #replay-btn:hover {
        border-color: #666;
        color: #ccc;
      }

      #final-footer {
        position: fixed;
        bottom: 30px;
        width: 100%;
        text-align: center;
        font-family: 'Special Elite', serif;
        font-size: 0.7rem;
        color: #333;
        z-index: 1000;
        opacity: 0;
        transition: opacity 2s ease 1s;
      }
      .visible-block {
        opacity: 1 !important;
        pointer-events: auto !important;
      }

      /* --- LYRICS CONTAINER --- */
      #lyric-container {
        position: relative;
        z-index: 50;
        width: 85%;
        max-width: 900px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 300px;
        perspective: 1000px;
      }

      /* Lyric Styling */
      .lyric-tl {
        /* Tagalog Main */
        font-size: 2.5rem;
        font-weight: 700;
        color: #eee;
        margin-bottom: 15px;
        opacity: 0;
        transform: translateY(20px);
        filter: blur(5px);
        transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        text-shadow: 0 0 20px rgba(0, 0, 0, 1);
      }
      .lyric-sub {
        /* Translations */
        font-size: 1rem;
        color: var(--text-ghost);
        font-style: italic;
        opacity: 0;
        transform: translateY(10px);
        transition: all 1s ease 0.3s;
      }

      .lyric-tl.show {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
      .lyric-sub.show {
        opacity: 1;
        transform: translateY(0);
      }

      /* --- MOODS & STYLES --- */

      /* 1. Paranoid (Verse) - Dim, nervous */
      .mood-paranoid #flashlight {
        opacity: 0.3;
        animation: searchLight 10s infinite alternate;
      }

      /* 2. Haunted (Pre-Chorus) - Flickering light */
      .mood-haunted #flashlight {
        opacity: 0.5;
        animation: flicker 0.15s infinite;
      }
      .mood-haunted .lyric-tl {
        text-shadow: 2px 2px 0 #000;
        letter-spacing: 1px;
      }

      /* 3. CLIMAX (POLTERGEIST) - Violent */
      .mood-poltergeist {
        background-color: #0a0000;
      }
      .mood-poltergeist #flashlight {
        background: radial-gradient(circle at 50% 50%, rgba(200, 200, 200, 0.2) 0%, transparent 50%);
        opacity: 1;
        animation: violentShake 0.1s infinite;
      }
      .mood-poltergeist .lyric-tl {
        font-family: 'Special Elite', cursive;
        font-size: 3.5rem;
        color: #fff;
        animation: textGlitch 0.2s infinite;
        text-shadow: 3px 0 var(--glitch-red), -3px 0 var(--glitch-blue);
      }
      .mood-poltergeist .lyric-sub {
        color: #800;
        font-weight: bold;
      }

      /* 4. Highlight */
      .highlight-word {
        color: #b0c4de;
        text-shadow: 0 0 10px #b0c4de;
        font-style: italic;
      }

      /* --- KEYFRAMES --- */
      @keyframes flicker {
        0% {
          opacity: 0.8;
        }
        50% {
          opacity: 0.2;
        }
        100% {
          opacity: 0.8;
        }
      }
      @keyframes searchLight {
        0% {
          transform: translateX(-20%) translateY(-10%);
        }
        100% {
          transform: translateX(20%) translateY(10%);
        }
      }

      @keyframes shadowPass {
        0% {
          transform: translateX(-150vw) scale(0.8);
          opacity: 0;
        }
        50% {
          opacity: 0.8;
        }
        100% {
          transform: translateX(150vw) scale(1.2);
          opacity: 0;
        }
      }

      @keyframes violentShake {
        0% {
          transform: translate(1px, 1px) rotate(0deg);
        }
        25% {
          transform: translate(-1px, -2px) rotate(-1deg);
        }
        50% {
          transform: translate(-3px, 0px) rotate(1deg);
        }
        75% {
          transform: translate(3px, 2px) rotate(0deg);
        }
        100% {
          transform: translate(1px, -1px) rotate(-1deg);
        }
      }

      @keyframes textGlitch {
        0% {
          clip-path: inset(10% 0 30% 0);
          transform: translate(-2px, 2px);
        }
        20% {
          clip-path: inset(60% 0 10% 0);
          transform: translate(2px, -1px);
        }
        40% {
          clip-path: inset(40% 0 50% 0);
          transform: translate(-1px, 2px);
        }
        60% {
          clip-path: inset(80% 0 5% 0);
          transform: translate(2px, 1px);
        }
        80% {
          clip-path: inset(20% 0 60% 0);
          transform: translate(-1px, -2px);
        }
        100% {
          clip-path: inset(10% 0 30% 0);
          transform: translate(1px, 1px);
        }
      }

      @media (max-width: 600px) {
        .lyric-tl {
          font-size: 1.8rem;
        }
        .mood-poltergeist .lyric-tl {
          font-size: 2.2rem;
        }
      }
    </style>
  </head>
  <body class="mood-paranoid">
    <nav id="song-nav">
      <a href="index.html" class="nav-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Library</span>
      </a>
      <a href="https://x.com/syuby" target="_blank" class="nav-x">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>

    <div id="flashlight"></div>
    <div id="shadow-realm"></div>
    <div id="overlay">
      <h1>MULTO</h1>
      <p>[ CLICK TO ENTER THE ROOM ]</p>
    </div>

    <div id="ending-screen">
      <h1>"Let me rest..."</h1>
      <button id="replay-btn">Turn Light On</button>
    </div>

    <div id="final-footer">from: syuby</div>

    <audio id="audio-player">
      <source src="multo.mp3" type="audio/mpeg" />
    </audio>

    <div id="lyric-container">
      <div id="tl-line" class="lyric-tl"></div>
      <div id="en-line" class="lyric-sub"></div>
      <div id="id-line" class="lyric-sub"></div>
    </div>

    <script>
      const audio = document.getElementById('audio-player');
      const overlay = document.getElementById('overlay');
      const lyricContainer = document.getElementById('lyric-container');
      const tlLine = document.getElementById('tl-line');
      const enLine = document.getElementById('en-line');
      const idLine = document.getElementById('id-line');
      const shadowRealm = document.getElementById('shadow-realm');
      const endingScreen = document.getElementById('ending-screen');
      const finalFooter = document.getElementById('final-footer');
      const replayBtn = document.getElementById('replay-btn');
      const songNav = document.getElementById('song-nav');

      let currentLineIndex = -1;
      let shadowInterval;

      // --- GAP FILLER: THE SHADOWS ---
      function spawnShadow() {
        const el = document.createElement('div');
        el.className = 'shadow-entity';

        // Random start height
        el.style.top = `${Math.random() * 80}%`;

        // Random direction (Left->Right or Right->Left)
        const direction = Math.random() > 0.5 ? 1 : -1;

        // Adjust start position based on direction
        el.style.left = direction === 1 ? '-20%' : '120%';

        // Customize animation via JS for direction
        const moveX = direction === 1 ? '150vw' : '-150vw';

        el.animate(
          [
            { transform: `translateX(0) scale(0.8)`, opacity: 0 },
            { opacity: 0.6, offset: 0.5 },
            { transform: `translateX(${moveX}) scale(1.2)`, opacity: 0 },
          ],
          {
            duration: 2500 + Math.random() * 1000,
            easing: 'linear',
            fill: 'forwards',
          }
        );

        shadowRealm.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }

      function startShadows(intensity = 1500) {
        if (!shadowInterval) shadowInterval = setInterval(spawnShadow, intensity);
      }
      function stopShadows() {
        clearInterval(shadowInterval);
        shadowInterval = null;
      }

      // --- DATA ---
      const lyrics = [
        { time: 0, type: 'gap' },

        // VERSE 1
        { time: 22.16, tl: 'Humingang malalim, pumikit na muna', en: 'Take a deep breath, close your eyes first', id: 'Tarik napas dalam, pejamkan mata dulu', type: 'paranoid' },
        { time: 31.75, tl: 'At baka sakaling namamalikmata lang', en: 'Maybe my eyes are just playing tricks', id: 'Mungkin mataku hanya salah lihat', type: 'paranoid' },
        { time: 40.83, tl: "Ba't nababahala? 'Di ba't ako'y mag-isa?", en: "Why worry? Aren't I alone?", id: 'Kenapa khawatir? Bukankah aku sendiri?', type: 'paranoid' },
        { time: 50.25, tl: "Kala ko'y payapa, boses mo'y tumatawag pa", en: 'Thought it was peaceful, but your voice still calls', id: 'Kukira damai, suaramu masih memanggil', type: 'haunted' },

        // PRE-CHORUS
        { time: 59.84, tl: 'Binaon naman na ang lahat', en: "I've buried everything", id: 'Sudah kubur semuanya', type: 'paranoid' },
        { time: 64.3, tl: "Tinakpan naman na 'king sugat", en: 'Covered up my wounds', id: 'Sudah tutupi lukaku', type: 'paranoid' },
        { time: 68.87, tl: "Ngunit ba't ba andito pa rin?", en: 'But why are you still here?', id: 'Tapi kenapa masih di sini?', type: 'haunted' },
        { time: 73.87, tl: "Hirap na 'kong intindihin", en: "I'm struggling to understand", id: 'Sulit bagiku mengerti', type: 'paranoid' },

        { time: 78.01, tl: 'Tanging panalangin, lubayan na sana', en: 'My only prayer, please leave me be', id: 'Satu doaku, tolong tinggalkan aku', type: 'paranoid' },
        { time: 86.88, tl: "Dahil sa bawat tingin, mukha mo'y nakikita", en: 'Cause in every glance, I see your face', id: 'Karna di setiap tatapan, wajahmu terlihat', type: 'haunted' },
        { time: 96.45, tl: "Kahit sa'n man mapunta ay anino mo'y kumakapit sa 'king kamay", en: 'Wherever I go, your shadow clings to my hand', id: 'Kemanapun pergi, bayanganmu memegang tanganku', type: 'haunted' },

        { time: 105.61, tl: 'Ako ay dahan-dahang nililibing nang buhay pa', en: 'I am slowly being buried alive', id: 'Aku perlahan dikubur hidup-hidup', type: 'paranoid' },

        // CHORUS 1 (POLTERGEIST)
        { time: 114.83, tl: 'Hindi na makalaya', en: "Can't break free anymore", id: 'Tak bisa bebas lagi', type: 'poltergeist' },
        { time: 119.41, tl: "Dinadalaw mo 'ko bawat gabi", en: 'You visit me every night', id: 'Kau mengunjungiku tiap malam', type: 'poltergeist' },
        { time: 124.07, tl: 'Wala mang nakikita', en: 'Even if nothing is seen', id: 'Meski tak ada yang terlihat', type: 'haunted' },
        { time: 128.69, tl: "Haplos mo'y ramdam pa rin sa dilim", en: 'Your touch is still felt in the dark', id: 'Sentuhanmu masih terasa di gelap', type: 'haunted' },

        { time: 133.19, tl: 'Hindi na nananaginip', en: 'No longer dreaming', id: 'Tak lagi bermimpi', type: 'paranoid' },
        { time: 137.89, tl: 'Hindi na ma-makagising', en: 'Can no longer wake up', id: 'Tak bisa bangun lagi', type: 'paranoid' },

        { time: 142.52, tl: 'Pasindi na ng ilaw', en: 'TURN ON THE LIGHT', id: 'NYALAKAN LAMPUNYA', type: 'highlight' },
        { time: 146.93, tl: "MINUMULTO NA 'KO NG DAMDAMIN KO", en: "I'M BEING HAUNTED BY MY FEELINGS", id: 'AKU DIHANTUI PERASAANKU', type: 'poltergeist' },

        { time: 153.28, tl: "'Di mo ba ako lilisanin?", en: "Won't you leave me?", id: 'Takkan kau tinggalkan aku?', type: 'paranoid' },
        { time: 157.25, tl: "Hindi pa ba sapat pagpapahirap sa 'kin?", en: "Isn't the torture enough?", id: 'Belum cukupkah siksaan ini?', type: 'paranoid' },

        { time: 161.84, tl: 'Hindi na ba ma-mamamayapa?', en: 'Will it never rest?', id: 'Takkan pernah damai?', type: 'haunted' },
        { time: 166.7, tl: 'Hindi na ba ma-mamamayapa?', en: 'Will it never rest?', id: 'Takkan pernah damai?', type: 'haunted' },

        // CHORUS 2 (CHAOS)
        { time: 170.39, tl: 'Hindi na makalaya', en: "Can't break free anymore", id: 'Tak bisa bebas lagi', type: 'poltergeist' },
        { time: 174.62, tl: "Dinadalaw mo 'ko bawat gabi", en: 'You visit me every night', id: 'Kau mengunjungiku tiap malam', type: 'poltergeist' },
        { time: 179.38, tl: 'Wala mang nakikita', en: 'Even if nothing is seen', id: 'Meski tak ada yang terlihat', type: 'haunted' },
        { time: 183.95, tl: "Haplos mo'y ramdam pa rin sa dilim", en: 'Your touch is still felt in the dark', id: 'Sentuhanmu masih terasa di gelap', type: 'haunted' },

        { time: 188.62, tl: 'Hindi na nananaginip', en: 'No longer dreaming', id: 'Tak lagi bermimpi', type: 'paranoid' },
        { time: 193.11, tl: 'Hindi na ma-makagising', en: 'Can no longer wake up', id: 'Tak bisa bangun lagi', type: 'paranoid' },

        { time: 197.62, tl: 'Pasindi na ng ilaw', en: 'TURN ON THE LIGHT', id: 'NYALAKAN LAMPUNYA', type: 'highlight' },
        { time: 202.49, tl: "MINUMULTO NA 'KO NG DAMDAMIN KO", en: "I'M BEING HAUNTED BY MY FEELINGS", id: 'AKU DIHANTUI PERASAANKU', type: 'poltergeist' },

        // OUTRO (Fading)
        { time: 208.37, tl: '(Makalaya) hindi mo ba ako lilisanin?', en: "(Break free) Won't you leave me?", id: '(Bebas) Takkan kau tinggalkan aku?', type: 'paranoid' },
        { time: 212.76, tl: "(Dinadalaw mo 'ko...) hindi pa ba sapat?", en: "(Visiting me...) Isn't it enough?", id: '(Mengunjungiku...) Belum cukupkah?', type: 'paranoid' },
        { time: 217.35, tl: '(Wala mang nakikita) hindi na ba ma-mamamayapa?', en: 'Will it never rest?', id: 'Takkan pernah damai?', type: 'haunted' },
        { time: 221.51, tl: "(Haplos mo'y ramdam...) hindi na ba ma-mamamayapa?", en: 'Will it never rest?', id: 'Takkan pernah damai?', type: 'haunted' },

        { time: 226.65, type: 'gap' },
      ];

      overlay.addEventListener('click', () => {
        overlay.style.opacity = '0';
        setTimeout(() => (overlay.style.display = 'none'), 1500);
        songNav.classList.add('nav-hidden');
        audio.play();
        startShadows(1000); // Start frequent shadows in intro
      });

      audio.addEventListener('timeupdate', () => {
        const currentTime = audio.currentTime;
        let activeIndex = -1;
        for (let i = 0; i < lyrics.length; i++) {
          if (currentTime >= lyrics[i].time) activeIndex = i;
          else break;
        }
        if (activeIndex !== -1 && activeIndex !== currentLineIndex) {
          renderLyric(lyrics[activeIndex]);
          currentLineIndex = activeIndex;
        }
      });

      function renderLyric(line) {
        // MOOD HANDLER
        document.body.className = `mood-${line.type || 'paranoid'}`;

        // HIGHLIGHT LOGIC
        if (line.type === 'highlight') {
          tlLine.classList.add('highlight-word');
        } else {
          tlLine.classList.remove('highlight-word');
        }

        // GAP HANDLING
        if (line.type === 'gap') {
          tlLine.classList.remove('show');
          enLine.classList.remove('show');
          idLine.classList.remove('show');
          startShadows();
          return;
        }

        // LYRIC RENDER
        stopShadows();

        // Small delay for clean transition
        setTimeout(() => {
          tlLine.innerHTML = line.tl;
          enLine.innerHTML = line.en;
          idLine.innerHTML = line.id;

          tlLine.classList.add('show');
          enLine.classList.add('show');
          idLine.classList.add('show');
        }, 100);
      }

      audio.addEventListener('ended', () => {
        stopShadows();
        tlLine.classList.remove('show');
        enLine.classList.remove('show');
        idLine.classList.remove('show');

        endingScreen.classList.add('visible-block');
        endingScreen.style.opacity = '1';
        endingScreen.style.visibility = 'visible';
        endingScreen.style.pointerEvents = 'auto';

        finalFooter.classList.add('visible-block');
        finalFooter.style.opacity = '1';

        songNav.classList.remove('nav-hidden');
      });

      replayBtn.addEventListener('click', () => {
        endingScreen.style.opacity = '0';
        endingScreen.style.visibility = 'hidden';
        endingScreen.style.pointerEvents = 'none';
        finalFooter.style.opacity = '0';
        songNav.classList.add('nav-hidden');

        audio.currentTime = 0;
        audio.play();
        currentLineIndex = -1;
        renderLyric(lyrics[0]);
      });
    </script>
  </body>
</html>

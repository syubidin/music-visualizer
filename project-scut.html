<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Surat Cinta Untuk Starla - Virgoun</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Reenie+Beanie&family=Cinzel:wght@700&display=swap" rel="stylesheet" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='0' y='0' width='64' height='64' rx='16' fill='%232b2b2b'/%3E%3Cpath d='M18 32L18 32 M27 20L27 44 M36 14L36 50 M45 20L45 44 M54 32L54 32' stroke='%23f0e6d2' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <style>
      :root {
        --bg-paper: #f4eadd;
        --bg-climax: #2e1a1a; /* Darkened room for climax */
        --ink-main: #1a1a1a;
        --ink-climax: #ffcccc; /* Glowing text color */
        --highlight-color: #8a2be2;
        --shadow-paper: rgba(0, 0, 0, 0.2);
      }

      /* RESET & MOBILE LOCK */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-paper);
        color: var(--ink-main);
        font-family: 'Special Elite', monospace;
        overflow: hidden; /* Prevent scrolling */
        position: fixed; /* Lock body for iOS */
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        transition: background-color 2s cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      /* --- ATMOSPHERE LAYERS --- */

      /* 1. Paper Grain Texture */
      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.15'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
        mix-blend-mode: multiply;
      }

      /* 2. Vignette (Focus Light) */
      .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, transparent 50%, rgba(40, 30, 20, 0.4) 120%);
        pointer-events: none;
        z-index: 2;
        transition: background 2s ease;
      }

      /* 3. Floating Dust Particles */
      #dust-container {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }
      .dust {
        position: absolute;
        background: #8b7d6b;
        border-radius: 50%;
        opacity: 0.4;
        animation: floatDust linear infinite;
      }

      /* --- MAIN STAGE: THE PAPER --- */
      #stage-wrapper {
        position: relative;
        z-index: 10;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px; /* Enable 3D */
      }

      #paper-sheet {
        width: 85%;
        max-width: 800px;
        min-height: 300px;
        padding: 40px;
        /* Styling to look like a physical paper */
        background: rgba(255, 255, 255, 0); /* Transparent initially to blend */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        /* The 3D Floating Animation */
        transform-style: preserve-3d;
        animation: breathePaper 8s ease-in-out infinite;
        transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.5s ease;
        will-change: transform;
      }

      /* --- TYPOGRAPHY --- */
      #typewriter-text {
        font-size: 1.8rem;
        line-height: 1.6;
        min-height: 2rem;
        white-space: pre-wrap;
        position: relative;
        text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.1);
        transition: color 0.5s, text-shadow 0.5s, font-size 0.5s;
      }

      .cursor {
        display: inline-block;
        width: 3px;
        height: 1.5em;
        background-color: currentColor;
        opacity: 0.7;
        animation: blink 1s steps(2, start) infinite;
        vertical-align: text-bottom;
        margin-left: 2px;
      }

      /* --- MOOD CLASSES (Applied to Body/Paper) --- */

      /* 1. INTRO (Faded, distant) */
      .mood-intro #typewriter-text {
        font-size: 1.4rem;
        color: #555;
        font-style: italic;
      }

      /* 2. VERSE (Standard Typewriter) */
      .mood-verse #typewriter-text {
        font-size: 1.8rem;
        color: var(--ink-main);
      }

      /* 3. CHORUS (Emphasized) */
      .mood-chorus #typewriter-text {
        font-size: 2rem;
        color: var(--ink-main);
        font-weight: bold;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.2);
      }

      /* 4. CLIMAX (THE BURNING INK) */
      body.mood-climax {
        background-color: var(--bg-climax);
      }

      .mood-climax .vignette {
        background: radial-gradient(circle, transparent 20%, #000 130%);
      }

      .mood-climax #paper-sheet {
        transform: scale(1.1) rotate(0deg) translateZ(50px); /* Zoom in 3D */
        filter: contrast(1.2);
      }

      .mood-climax #typewriter-text {
        color: #ffb3b3; /* Pale red glow */
        text-shadow: 0 0 10px rgba(255, 50, 50, 0.8), 0 0 20px rgba(255, 0, 0, 0.4);
        font-size: 2.2rem;
      }

      .mood-climax .cursor {
        background-color: #ff0000;
        box-shadow: 0 0 10px #ff0000;
      }

      /* 5. HIGHLIGHT (Red Ink) */
      span.highlight {
        color: #9e2a2b;
        font-weight: bold;
        text-shadow: 0 0 2px rgba(158, 42, 43, 0.3);
      }

      /* --- UI ELEMENTS --- */
      #song-nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 20px 30px;
        z-index: 9999;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: opacity 1s ease, transform 1s ease;
        pointer-events: auto;
      }
      #song-nav.nav-hidden {
        opacity: 0;
        transform: translateY(-20px);
        pointer-events: none;
      }
      .nav-home,
      .nav-x {
        color: #333;
        opacity: 0.6;
        transition: 0.3s;
        text-decoration: none;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .nav-home:hover,
      .nav-x:hover {
        opacity: 1;
        transform: scale(1.1);
      }

      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #e8dec8;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 200;
        transition: opacity 1.2s ease;
        box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.2);
      }
      #overlay h1 {
        font-size: 2.5rem;
        border-bottom: 2px solid #333;
        padding-bottom: 10px;
        margin-bottom: 10px;
      }

      #ending-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(244, 234, 221, 0.95);
        z-index: 150;
        opacity: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 2s ease;
      }
      #signature {
        font-family: 'Reenie Beanie', cursive;
        font-size: 3rem;
        margin: 20px 0;
        transform: rotate(-3deg);
        position: relative;
      }
      #signature::after {
        content: 'V';
        position: absolute;
        right: -30px;
        bottom: -15px;
        width: 40px;
        height: 40px;
        background: #9e2a2b;
        border-radius: 50%;
        color: rgba(255, 255, 255, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Cinzel', serif;
        font-size: 1.2rem;
        box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        border: 2px dashed rgba(255, 255, 255, 0.2);
      }
      #replay-btn {
        background: transparent;
        border: 2px solid #333;
        color: #333;
        padding: 10px 30px;
        font-family: 'Special Elite', monospace;
        cursor: pointer;
        transition: 0.3s;
      }
      #replay-btn:hover {
        background: #333;
        color: #fff;
      }

      #final-footer {
        position: fixed;
        bottom: 30px;
        width: 100%;
        text-align: center;
        font-family: 'Special Elite', monospace;
        font-size: 0.8rem;
        color: #666;
        z-index: 1000;
        opacity: 0;
        transition: opacity 2s ease 1s;
      }
      .visible-block {
        opacity: 1 !important;
        pointer-events: auto !important;
      }

      /* --- ANIMATIONS --- */
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      @keyframes floatDust {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 0;
        }
        50% {
          opacity: 0.8;
        }
        100% {
          transform: translateY(200px) rotate(180deg);
          opacity: 0;
        }
      }
      @keyframes breathePaper {
        0% {
          transform: rotate(-0.5deg) translateY(0);
        }
        50% {
          transform: rotate(0.5deg) translateY(-5px);
        }
        100% {
          transform: rotate(-0.5deg) translateY(0);
        }
      }
      @keyframes typeHit {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.002);
        }
        100% {
          transform: scale(1);
        }
      }

      /* Mobile Adjustments */
      @media (max-width: 600px) {
        #typewriter-text {
          font-size: 1.3rem;
        }
        .mood-climax #typewriter-text {
          font-size: 1.5rem;
        }
        #paper-sheet {
          width: 90%;
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <nav id="song-nav">
      <a href="index.html" class="nav-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Library</span>
      </a>
      <a href="https://x.com/syuby" target="_blank" class="nav-x">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
      </a>
    </nav>

    <div class="vignette"></div>
    <div id="dust-container"></div>

    <div id="overlay">
      <h1>SURAT CINTA</h1>
      <p>untuk Starla...</p>
      <p style="font-family: 'Special Elite'; font-size: 0.8rem; margin-top: 40px; opacity: 0.6">[ CLICK TO READ ]</p>
    </div>

    <div id="ending-screen">
      <h1 style="font-family: 'Cinzel', serif; font-size: 1.5rem; margin-bottom: 20px">Telah Habis.</h1>
      <p>Terima kasih telah membaca.</p>
      <div id="signature">Sincerely, Virgoun.</div>
      <button id="replay-btn">Read Again</button>
    </div>
    <div id="final-footer">from: syuby</div>

    <audio id="audio-player">
      <source src="scut.mp3" type="audio/mpeg" />
    </audio>

    <div id="stage-wrapper">
      <div id="paper-sheet">
        <div id="typewriter-text"><span class="cursor"></span></div>
      </div>
    </div>

    <script>
      const audio = document.getElementById('audio-player');
      const overlay = document.getElementById('overlay');
      const paperSheet = document.getElementById('paper-sheet');
      const textContainer = document.getElementById('typewriter-text');
      const dustContainer = document.getElementById('dust-container');
      const endingScreen = document.getElementById('ending-screen');
      const finalFooter = document.getElementById('final-footer');
      const replayBtn = document.getElementById('replay-btn');
      const songNav = document.getElementById('song-nav');
      const body = document.body;

      let currentLineIndex = -1;
      let typeInterval;

      // --- PARTICLES ---
      function createDust() {
        const mote = document.createElement('div');
        mote.className = 'dust';
        const size = Math.random() * 3 + 1;
        mote.style.width = `${size}px`;
        mote.style.height = `${size}px`;
        mote.style.left = `${Math.random() * 100}%`;
        mote.style.animationDuration = `${Math.random() * 15 + 10}s`; // Slow floating
        dustContainer.appendChild(mote);
        setTimeout(() => mote.remove(), 25000);
      }
      setInterval(createDust, 1000);

      // --- DATA ---
      const lyrics = [
        { time: 0, text: '', type: 'gap' },
        // INTRO
        { time: 2.58, text: 'Teruntuk kamu, hidup dan matiku', type: 'intro' },
        { time: 6.57, text: 'Aku tak tahu lagi harus dengan kata apa aku menuliskannya\nAtau dengan kalimat apa aku mengungkapkannya', type: 'intro' },
        { time: 14.92, text: 'Karena untuk keberkian kalinya\nKau buat aku kembali percaya akan kata cinta', type: 'intro' },
        { time: 21.56, text: 'Dan benar, bahwa cinta masih berkuasa di atas segalanya', type: 'intro' },
        { time: 26.64, text: 'Ketika hati yang mudah rapuh ini\nDiuji oleh duniawi, diuji oleh materi untuk kesekian kali', type: 'intro' },
        { time: 35.21, text: 'Lagi, lagi, dan lagi', type: 'highlight' },

        { time: 40.1, text: '', type: 'gap' },

        // VERSE 1
        { time: 65.66, text: 'Kutuliskan kenangan tentang\nCaraku menemukan dirimu', type: 'normal' },
        { time: 75.76, text: 'Tentang apa yang membuatku mudah\nBerikan hatiku padamu', type: 'normal' },
        { time: 85.73, text: 'Takkan habis sejuta lagu\nUntuk menceritakan cantikmu', type: 'normal' },
        { time: 95.6, text: "'Kan teramat panjang puisi\n'Tuk menyuratkan cinta ini", type: 'normal' },

        // CHORUS 1
        { time: 103.94, text: 'Telah habis sudah cinta ini\nTak lagi tersisa untuk dunia', type: 'chorus' },
        { time: 113.63, text: "Karena t'lah kuhabiskan\nSisa cintaku hanya untukmu", type: 'highlight' },

        { time: 123.88, text: '', type: 'gap' },

        // VERSE 2
        { time: 130.61, text: 'Aku pernah berfikir tentang\nHidupku tanpa ada dirimu', type: 'normal' },
        { time: 140.65, text: 'Dapatkah lebih indah dari\nYang kujalani sampai kini?', type: 'normal' },
        { time: 150.82, text: "Aku s'lalu bermimpi tentang\nIndah hari tua bersamamu", type: 'normal' },
        { time: 160.73, text: 'Tetap cantik rambut panjangmu\nMeskipun nanti tak hitam lagi', type: 'normal' },

        // CHORUS 2
        { time: 169.04, text: 'Bila habis sudah waktu ini\nTak lagi berpijak pada dunia', type: 'chorus' },
        { time: 178.6, text: 'Telah aku habiskan\nSisa hidupku hanya untukmu', type: 'highlight' },
        { time: 188.82, text: "Dan t'lah habis sudah cinta ini\nTak lagi tersisa untuk dunia", type: 'chorus' },
        { time: 198.69, text: "Karena t'lah kuhabiskan\nSisa cintaku hanya untukmu", type: 'highlight' },

        { time: 207.5, text: '', type: 'gap' },

        // BRIDGE
        { time: 210.07, text: 'Untukmu hidup dan matiku', type: 'intro' },
        { time: 217.12, text: '', type: 'gap' },

        // CLIMAX
        { time: 223.55, text: 'Bila musim berganti\nSampai waktu terhenti', type: 'build' },
        { time: 233.43, text: "Walau dunia membenci\nKu 'kan tetap di sini", type: 'build' },
        { time: 243.46, text: 'Bila habis sudah waktu ini\n(Bila musim berganti)', type: 'climax' },
        { time: 248.79, text: 'Tak lagi berpijak pada dunia\n(Sampai waktu berhenti)', type: 'climax' },
        { time: 253.78, text: 'Telah aku habiskan\n(Walau dunia membenci)', type: 'climax' },
        { time: 257.91, text: "Sisa hidupku hanya untukmu\n(Ku 'kan tetap di sini)", type: 'climax' },
        { time: 263.89, text: 'Telah habis sudah cinta ini\n(Bila musim berganti)', type: 'climax' },
        { time: 268.37, text: 'Tak lagi tersisa untuk dunia\n(Sampai waktu terhenti)', type: 'climax' },
        { time: 273.44, text: 'Karena telah kuhabiskan\n(Walau dunia membenci)', type: 'climax' },
        { time: 276.89, text: "Sisa cintaku hanya untukmu\n(Ku 'kan tetap di sini)", type: 'climax' },

        // OUTRO
        { time: 283.6, text: 'Karena telah kuhabiskan', type: 'intro' },
        { time: 286.73, text: 'Sisa cintaku hanya untukmu', type: 'intro' },
        { time: 291.0, text: '(selamanya...)', type: 'intro' },
        { time: 294.0, text: '', type: 'gap' },
      ];

      overlay.addEventListener('click', () => {
        overlay.style.opacity = '0';
        setTimeout(() => (overlay.style.display = 'none'), 1200);
        songNav.classList.add('nav-hidden');
        audio.play().catch((e) => alert('Please interact to play audio'));
      });

      audio.addEventListener('timeupdate', () => {
        const currentTime = audio.currentTime;
        let activeIndex = -1;
        for (let i = 0; i < lyrics.length; i++) {
          if (currentTime >= lyrics[i].time) activeIndex = i;
          else break;
        }
        if (activeIndex !== -1 && activeIndex !== currentLineIndex) {
          renderLyric(lyrics[activeIndex]);
          currentLineIndex = activeIndex;
        }
      });

      function typeWriter(text, speed = 50) {
        textContainer.innerHTML = '<span class="cursor"></span>';
        const cursor = textContainer.querySelector('.cursor');
        let i = 0;
        clearInterval(typeInterval);

        typeInterval = setInterval(() => {
          if (i < text.length) {
            const char = text.charAt(i);
            const span = document.createElement('span');

            // Highlight logic inside text
            if (textContainer.parentElement.classList.contains('mood-highlight')) {
              span.classList.add('highlight');
            }

            char === '\n' ? (span.innerHTML = '<br>') : (span.textContent = char);
            textContainer.insertBefore(span, cursor);

            // Micro-animation on paper when typing
            paperSheet.style.animation = 'none';
            paperSheet.offsetHeight; /* trigger reflow */
            paperSheet.style.animation = 'typeHit 0.1s ease-out';

            i++;
          } else {
            clearInterval(typeInterval);
          }
        }, speed);
      }

      function renderLyric(line) {
        // CLIMAX CHECK
        if (line.type === 'climax' || line.type === 'build') {
          body.classList.add('mood-climax');
        } else {
          body.classList.remove('mood-climax');
        }

        // MOOD CLASSES FOR PAPER SHEET
        paperSheet.className = ''; // Reset
        if (line.type !== 'gap') paperSheet.classList.add(`mood-${line.type}`);

        if (line.type === 'gap') {
          textContainer.innerHTML = '<span class="cursor"></span>';
          return;
        }

        let speed = 60;
        if (line.text.length > 40) speed = 35; // Faster for long text
        if (line.type === 'intro') speed = 50;
        if (line.type === 'climax') speed = 40;

        typeWriter(line.text, speed);
      }

      audio.addEventListener('ended', () => {
        body.classList.remove('mood-climax');
        textContainer.innerHTML = '';
        endingScreen.classList.add('visible-block');
        finalFooter.classList.add('footer-visible');
        songNav.classList.remove('nav-hidden');
      });

      replayBtn.addEventListener('click', () => {
        endingScreen.classList.remove('visible-block');
        finalFooter.classList.remove('footer-visible');
        songNav.classList.add('nav-hidden');
        body.classList.remove('mood-climax');

        audio.currentTime = 0;
        audio.play();
        currentLineIndex = -1;
        renderLyric(lyrics[0]);
      });
    </script>
  </body>
</html>
